<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AT Honda Sale Calculator</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- A4: html2canvas remains for quotation/booking documents only; Offer Studio uses Single Canvas. -->
    <!-- A5: fixes Thai headline glyph clusters, benefit vector icons and 3-column contact layout. -->
    
    <style>
        :root {
            --honda-red: #cc0000;
            --honda-dark: #990000;

            /* แถบล่าง: แก้ตัวเลขนี้เพื่อเพิ่ม/ลดพื้นที่เว้นล่างของทุกหน้าหลัก */
            --at-bottom-strip-height: 4px;
        }
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; color: #1f2937; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .honda-text { color: var(--honda-red); }
        .only-in-image { display: none; }
        /* V3-RESPONSIVE: แตะใช้งานบนมือถือ / iPad / Android */
        html { -webkit-text-size-adjust: 100%; }
        button, select, label { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        @media (pointer: coarse) {
            input[type="text"], input[type="number"], input[type="tel"], input[type="date"], input:not([type]), select, textarea { font-size: 16px !important; }
        }
        @media (max-width: 639px) {
            .table-responsive { margin-left: -2px; margin-right: -2px; }
        }
        .bg-honda { background-color: var(--honda-red); }
        .card-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); transition: all 0.3s ease; }
        .input-modern { transition: all 0.2s; border: 1px solid #e5e7eb; }
        .input-modern:focus { border-color: var(--honda-red); box-shadow: 0 0 0 3px rgba(204, 0, 0, 0.1); outline: none; }
        .color-swatch.selected { border: 2px solid var(--honda-red); background-color: #fef2f2; transform: scale(1.02); }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px); }
        .animate-pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
        .fade-in-out { animation: fadeEffect 3s infinite; }
        @keyframes fadeEffect { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
        #booking-card-container { position: absolute; left: -9999px; top: 0; }
        /* =====================================================================
           OS-REV-21 / A3 — AUTO/MANUAL LAYOUT + COLLISION AUDIT + SHELL WIDTH FIX
           OS-REV-20 — FALSE OVERFLOW / DIVIDER / CONTACT POSITION FIX
           - Audit blocks only real clipped overflow, not harmless fractional scroll metrics.
           - Divider is an isolated line with protected top/bottom spacing.
           - QR and dealer logo reserve extra right safe space and align left within their columns.
           Search keyword: OS-REV-20-OFFER-LAYOUT-FIX

           OS-REV-19 — OFFER STUDIO TWO-LAYER RENDER
           Preview layer is scaled for the screen. Export layer stays at the exact
           requested pixel size and is never moved, resized or transformed while
           html2canvas is working. It is not display:none/visibility:hidden because
           browsers would omit it from capture.
           ===================================================================== */
        .offer-export-stage {
            position: fixed;
            left: 0;
            top: 0;
            width: 0;
            height: 0;
            overflow: visible;
            pointer-events: none;
            z-index: -2147483000;
            contain: none;
        }
        .offer-export-stage-inner {
            position: absolute;
            left: 0;
            top: 0;
            margin: 0;
            padding: 0;
            overflow: visible;
            transform: none !important;
            transform-origin: top left;
        }
        /* =====================================================================
           OS-REV-22 / A4 — SINGLE CANVAS PIXEL-EXACT OFFER RENDERER
           Offer Studio no longer uses html2canvas for preview/export.
           One full-resolution canvas is rendered once. Every preview displays
           the PNG Blob made from that canvas, and Download uses the same Blob.
           Therefore Preview and Download use the same pixel buffer.
           Search keyword: OS-REV-22-SINGLE-CANVAS
           ===================================================================== */
        .offer-canvas-source-stage {
            position: fixed;
            left: -20000px;
            top: 0;
            pointer-events: none;
            z-index: -2147483000;
            overflow: visible;
        }
        .offer-pixel-preview-image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }
        .offer-fit-badge {
            display:inline-flex;
            align-items:center;
            gap:5px;
            border-radius:999px;
            padding:3px 8px;
            font-size:10px;
            font-weight:800;
            line-height:1;
            white-space:nowrap;
        }
        /* OS-REV-13: Offer Studio exports from the active live preview renderer. */
        @media print { .no-print { display: none !important; } body { background-color: white; -webkit-print-color-adjust: exact; } .card-shadow { box-shadow: none; border: none; } input, select { border: none !important; background: transparent !important; appearance: none; padding: 0; } }
        .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        th, td { white-space: nowrap; }

        /* =====================================================================
           GLOBAL BOTTOM STRIP — แถบล่าง
           ใช้ร่วมกันกับใบเสนอราคา / ตารางนอก / เปรียบเทียบ /
           เอกสารภายใน / Offer Studio
           ปรับความสูงที่ตัวแปร --at-bottom-strip-height ด้านบน
           ===================================================================== */
        .at-bottom-strip {
            width:100%;
            height:var(--at-bottom-strip-height);
            min-height:var(--at-bottom-strip-height);
            flex:0 0 var(--at-bottom-strip-height);
            background:#f3f4f6;
        }


        /* OS-REV-09-PREVIEW-CAPTURE:
           Popup นี้แสดง Data URL จาก Live Preview โดยตรง จึงห้ามวาด/จัดข้อความใหม่ใน Popup */
        /* OS-REV-08-IMAGE-PREVIEW:
           Generated-image popup contains the exact exported PNG without re-layout. */
        /* REV07-IMAGE-PREVIEW: Generated-image popup always shows the full image.
           The stage contains the image instead of making the user scroll inside it. */
        .at-image-preview-card {
            height:min(66.666vh, 760px) !important;
            min-height:360px;
            overflow:hidden !important;
        }
        .at-image-preview-stage {
            flex:1 1 auto;
            min-height:0;
            overflow:hidden !important;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .at-image-preview-stage img {
            display:block;
            width:auto;
            height:auto;
            max-width:100%;
            max-height:100%;
            object-fit:contain;
        }
        /* =====================================================================
           OFFER STUDIO — CSS PART OS-CSS
           OS-CSS-01: Scrollbar / transparency preview
           OS-CSS-02: Field toggle controls
           OS-CSS-03: Desktop three-column workspace
           OS-CSS-04: Mobile tabs and responsive workspace
           Search keyword: OFFER STUDIO — CSS PART
           ===================================================================== */
        .offer-studio-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
        .offer-studio-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
        .offer-checkerboard {
            background-color: #ffffff;
            background-image: linear-gradient(45deg, #e5e7eb 25%, transparent 25%),
                              linear-gradient(-45deg, #e5e7eb 25%, transparent 25%),
                              linear-gradient(45deg, transparent 75%, #e5e7eb 75%),
                              linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
            background-size: 24px 24px;
            background-position: 0 0, 0 12px, 12px -12px, -12px 0;
        }
        .offer-toggle { appearance:none; width:38px; height:22px; border-radius:999px; background:#d1d5db; position:relative; cursor:pointer; transition:.2s; flex-shrink:0; }
        .offer-toggle::after { content:''; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:.2s; }
        .offer-toggle:checked { background:#16a34a; }
        .offer-toggle:checked::after { transform:translateX(16px); }
        /* OS-REV-05: Mobile + Tablet Inline Preview (non-sticky, 220/240px) */
        /* OS-CSS-03: Desktop workspace */
        .offer-studio-modal { background:#edf0f4; }
        .offer-studio-body { height:calc(100vh - 64px); min-height:0; }
        .offer-studio-topbar { flex-shrink:0; }
        .offer-mobile-tabs { display:none; }
        .offer-mobile-inline-preview { display:none; }
        .offer-panel { min-width:0; }

        /* =====================================================================
           OS-REV-21 / A3 — LAYOUT STABILITY
           - CSS is the only owner of workspace columns; no inline min-width grid.
           - Full-screen shell is locked to the visual viewport and cannot expose
             the calculator background through a horizontal gap.
           - Auto/Manual layout controls use compact responsive grids.
           Search keyword: OS-REV-21-A3-LAYOUT
           ===================================================================== */
        html.offer-studio-open,
        body.offer-studio-open {
            width:100%;
            max-width:100%;
            overflow-x:hidden !important;
        }
        .offer-studio-modal {
            left:0;
            right:0;
            width:100dvw;
            max-width:100%;
            box-sizing:border-box;
            overflow-x:hidden !important;
            isolation:isolate;
        }
        .offer-studio-body,
        .offer-studio-topbar,
        .offer-studio-grid,
        .offer-studio-panel,
        .offer-studio-preview-shell {
            width:100%;
            max-width:100%;
            min-width:0;
            box-sizing:border-box;
        }
        .offer-studio-grid {
            grid-template-columns:minmax(300px, 390px) minmax(280px, 340px) minmax(0, 1fr);
            overflow-x:hidden;
        }
        .offer-layout-control-grid {
            display:grid;
            grid-template-columns:repeat(2, minmax(0, 1fr));
            gap:8px;
        }
        .offer-layout-control-grid > label { min-width:0; }
        .offer-layout-control-grid input,
        .offer-layout-control-grid select { width:100%; min-width:0; }
        .offer-layout-summary {
            border:1px solid #e5e7eb;
            background:#f8fafc;
            border-radius:12px;
            padding:9px 10px;
            font-size:10px;
            line-height:1.55;
            color:#475569;
        }

        /* Typography controls intentionally use one full-width row per item.
           This prevents the slider from overlapping the numeric input. */
        .offer-typography-grid { display:grid; grid-template-columns:minmax(0, 1fr); gap:12px; }
        .offer-typography-control { display:block; min-width:0; }
        .offer-typography-row { display:grid; grid-template-columns:minmax(0, 1fr) 72px; gap:10px; align-items:center; min-width:0; }
        .offer-typography-row input[type="range"] { width:100%; min-width:0; }
        .offer-typography-row input[type="number"] { width:100%; min-width:0; }

        @media (max-width: 1280px) {
            .offer-studio-grid { grid-template-columns:minmax(290px, 350px) minmax(270px, 320px) minmax(0, 1fr); }
        }

        /* OS-CSS-04: Mobile/Tablet workspace
           Only one workspace panel is shown at a time through the mobile tabs. */
        @media (max-width: 1024px) {
            .offer-studio-header { height:56px !important; min-height:56px; padding:8px 10px !important; gap:8px; }
            .offer-studio-header-brand { gap:10px !important; min-width:0; }
            .offer-studio-header-divider { display:none; }
            .offer-studio-header-actions { gap:6px !important; }
            .offer-studio-body { height:calc(100vh - 56px); }
            .offer-studio-topbar {
                grid-template-columns:repeat(2, minmax(0, 1fr)) !important;
                gap:8px !important;
                padding:10px !important;
                max-height:34vh;
                overflow-y:auto;
                -webkit-overflow-scrolling:touch;
            }
            .offer-mobile-tabs {
                display:grid;
                grid-template-columns:repeat(2, minmax(0, 1fr));
                gap:6px;
                padding:8px 10px;
                background:#ffffff;
                border-bottom:1px solid #e5e7eb;
                flex-shrink:0;
                z-index:20;
            }
            .offer-mobile-tab {
                min-height:42px;
                border:1px solid #e5e7eb;
                border-radius:12px;
                background:#ffffff;
                color:#4b5563;
                font-size:11px;
                font-weight:800;
                white-space:nowrap;
            }
            .offer-mobile-tab.active {
                color:#ffffff;
                border-color:#dc2626;
                background:#dc2626;
                box-shadow:0 4px 12px rgba(220,38,38,.18);
            }
            /* OS-CSS-04A: Mobile workflow is split into two steps.
               Step 1 = choose vehicle/data only.
               Step 2 = design controls + live preview shown together. */
            .offer-studio-grid {
                min-height:0;
                overflow-y:auto;
                -webkit-overflow-scrolling:touch;
                padding:10px 10px 90px !important;
            }
            .offer-studio-grid.offer-mobile-layout-data {
                display:block !important;
            }
            .offer-studio-grid.offer-mobile-layout-design {
                display:grid !important;
                grid-template-columns:minmax(0, 1fr) !important;
                gap:10px !important;
                align-items:start;
            }
            .offer-panel {
                display:none !important;
                width:100%;
                max-height:none !important;
                overflow:visible !important;
                border-radius:14px !important;
            }
            .offer-mobile-layout-data .offer-panel-data { display:block !important; }
            .offer-mobile-layout-design .offer-panel-design { display:block !important; order:1; }
            .offer-mobile-layout-design .offer-panel-preview {
                display:none !important;
            }
            /* OS-CSS-04A1: Phone + tablet inline live preview.
               Placement: directly after the topbar/file-name controls and before tabs.
               It is always in normal document flow (never sticky/fixed), so it cannot
               cover the Data or Design control panels. */
            .offer-mobile-inline-preview {
                display:flex;
                position:relative;
                inset:auto;
                z-index:1;
                flex-direction:column;
                align-items:center;
                justify-content:flex-start;
                gap:6px;
                flex:0 0 auto;
                width:auto;
                height:auto;
                margin:8px 10px 0;
                padding:8px 9px 9px;
                border:1px solid #dfe3e8;
                border-radius:14px;
                background:#ffffff;
                box-shadow:0 3px 10px rgba(15,23,42,.07);
                overflow:hidden;
            }
            .offer-mobile-inline-preview-head {
                width:100%;
                min-height:28px;
                display:flex;
                align-items:center;
                justify-content:space-between;
                gap:8px;
                font-size:10px;
                font-weight:800;
                color:#4b5563;
            }
            .offer-mobile-inline-preview-stage {
                position:relative;
                width:100%;
                height:220px;
                min-height:220px;
                max-height:220px;
                display:flex;
                align-items:center;
                justify-content:center;
                overflow:hidden;
                padding:6px;
                box-sizing:border-box;
                border-radius:10px;
                background:#eef0f3;
                contain:layout paint;
            }
            .offer-preview-settings { display:none !important; }
            .offer-live-preview-label {
                display:flex;
                width:100%;
                align-items:center;
                justify-content:space-between;
                gap:10px;
                padding:0 2px 8px;
                color:#374151;
                font-size:11px;
                font-weight:800;
                flex-shrink:0;
            }
            .offer-live-preview-canvas {
                margin:0 auto;
                flex:0 0 auto;
            }
            .offer-mobile-next-button {
                display:flex;
                position:sticky;
                bottom:8px;
                z-index:10;
                width:100%;
                min-height:48px;
                align-items:center;
                justify-content:center;
                gap:8px;
                border-radius:14px;
                background:#dc2626;
                color:#fff;
                font-size:12px;
                font-weight:900;
                box-shadow:0 10px 24px rgba(220,38,38,.24);
            }
        }


        /* OS-CSS-04B: Tablet follows the same inline-preview workflow as phones.
           No sticky preview panel is used at 768-1024px. */
        @media (min-width: 768px) and (max-width: 1024px) {
            .offer-mobile-inline-preview {
                display:flex !important;
                margin-left:12px;
                margin-right:12px;
            }
            .offer-mobile-inline-preview-stage {
                height:240px;
                min-height:240px;
                max-height:240px;
            }
            .offer-studio-grid.offer-mobile-layout-design {
                display:block !important;
                grid-template-columns:minmax(0, 1fr) !important;
            }
            .offer-mobile-layout-design .offer-panel-design {
                display:block !important;
                order:1;
            }
            .offer-mobile-layout-design .offer-panel-preview {
                display:none !important;
                position:static !important;
                inset:auto !important;
            }
        }

        @media (min-width: 1025px) {
            .offer-live-preview-label,
            .offer-mobile-next-button { display:none !important; }
        }


        /* =====================================================================
           OS-REV-06 — LONG SCROLL + STICKY PREVIEW + COMPACT TOP POPUPS
           OS-REV-06A: Mobile/tablet Offer Studio scrolls as one long document.
           OS-REV-06B: Inline preview becomes sticky only after reaching screen top.
           OS-REV-06C: Management/booking/preview popups align top and use 2/3 viewport.
           Search keyword: OS-REV-06
           ===================================================================== */

        /* Shared popup layout used by Action, Booking and generated-image preview. */
        .at-top-popup-overlay {
            align-items:flex-start !important;
            justify-content:center !important;
            overflow-y:auto !important;
            padding-top:12px !important;
            padding-bottom:12px !important;
            -webkit-overflow-scrolling:touch;
        }
        .at-top-popup-card {
            max-height:66.666vh !important;
            overflow-y:auto !important;
            overscroll-behavior:contain;
        }
        .at-action-menu-card { padding:16px !important; }
        .at-action-menu-header { margin-bottom:12px !important; padding-bottom:10px !important; }
        .at-action-menu-name { margin-bottom:12px !important; }
        .at-action-menu-list { gap:8px !important; }
        .at-action-menu-list > button { padding:10px !important; gap:12px !important; }
        .at-action-menu-list > button > div:first-child { width:36px !important; height:36px !important; }

        @media (max-width: 1024px) {
            /* The fixed full-screen shell remains, but the shell itself is now
               the only vertical scroll container. Everything from source fields
               through Design controls participates in the same scroll flow. */
            .offer-studio-modal {
                width:100dvw !important;
                max-width:100% !important;
                overflow-y:auto !important;
                overflow-x:hidden !important;
                overscroll-behavior-y:contain;
                -webkit-overflow-scrolling:touch;
            }
            .offer-studio-header {
                position:relative !important;
                top:auto !important;
                z-index:40;
            }
            .offer-studio-body {
                height:auto !important;
                min-height:calc(100vh - 56px) !important;
                overflow:visible !important;
                display:block !important;
            }
            .offer-studio-topbar {
                max-height:none !important;
                overflow:visible !important;
                flex-shrink:0 !important;
            }
            .offer-mobile-tabs {
                position:relative !important;
                top:auto !important;
                z-index:10 !important;
            }
            .offer-studio-grid {
                flex:none !important;
                min-height:auto !important;
                height:auto !important;
                overflow:visible !important;
                padding-bottom:42px !important;
            }
            .offer-panel,
            .offer-studio-panel {
                max-height:none !important;
                height:auto !important;
                overflow:visible !important;
            }

            /* Preview starts in normal flow below filename controls. When its top
               reaches the viewport top, CSS sticky freezes it there. */
            .offer-mobile-inline-preview {
                position:sticky !important;
                top:0 !important;
                z-index:35 !important;
                margin-top:8px !important;
                box-shadow:0 8px 20px rgba(15,23,42,.14) !important;
            }
            .offer-mobile-next-button { display:none !important; }
        }

        @media (max-width: 640px) {
            .offer-studio-header-title { font-size:13px !important; }
            .offer-studio-header-subtitle { display:none; }
            .offer-studio-header-actions button {
                width:38px;
                height:38px;
                padding:0 !important;
                display:inline-flex;
                align-items:center;
                justify-content:center;
                border-radius:10px;
            }
            .offer-action-text { display:none; }
            .offer-studio-topbar { grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important; }
            .offer-layout-control-grid { grid-template-columns:minmax(0,1fr); }
            .offer-studio-topbar > label,
            .offer-studio-topbar > div { min-width:0; }
            .offer-studio-topbar select,
            .offer-studio-topbar input { font-size:11px !important; }
            .offer-mobile-tabs { position:sticky; top:0; }
            .offer-typography-row { grid-template-columns:minmax(0, 1fr) 68px; gap:8px; }
            .offer-studio-preview-shell.offer-mobile-active { min-height:68vh; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback, memo } = React;

        // =====================================================================
        // AT HONDA OFFER STUDIO — CODE MAP
        // OS-01: Embedded Honda H Mark asset (no external image file required)
        // OS-02: Source, canvas, field and typography configuration
        // OS-03: Reusable UI helpers (logo, image picker, field toggle)
        // OS-04: Offer Studio editor/workspace
        // OS-05: Export canvas renderer
        // OS-06: Sale Calculator data adapter and integration handlers
        // Search keyword: AT HONDA OFFER STUDIO — CODE MAP
        // =====================================================================


        // =====================================================================
        // ZONE 2: SHARED HOOKS, STORAGE & LOCAL IMAGE HELPERS
        // Static vehicle/campaign tables remain outside App in ZONE 1.
        // These helpers are created once and reused by App and Offer Studio.
        // Search keyword: ARCH-ZONE-02
        // =====================================================================
        const STORAGE_ALERTED_KEYS = new Set();

        const safeJsonParse = (rawValue, fallback = null) => {
            if (!rawValue) return fallback;
            try { return JSON.parse(rawValue); }
            catch (error) {
                console.warn('JSON parse failed:', error);
                return fallback;
            }
        };

        const safeSetLocalStorage = (key, value, options = {}) => {
            const { silent = false, label = key } = options;
            try {
                const serialized = typeof value === 'string' ? value : JSON.stringify(value);
                localStorage.setItem(key, serialized);
                STORAGE_ALERTED_KEYS.delete(key);
                return true;
            } catch (error) {
                const quotaExceeded = error?.name === 'QuotaExceededError' || error?.code === 22 || error?.code === 1014;
                console.error(`Unable to save ${label}:`, error);
                if (!silent && !STORAGE_ALERTED_KEYS.has(key)) {
                    STORAGE_ALERTED_KEYS.add(key);
                    alert(quotaExceeded
                        ? `พื้นที่เก็บข้อมูลในเครื่องเต็ม ระบบยังใช้งานได้ แต่ไม่สามารถบันทึก ${label} ล่าสุดได้ กรุณาลบ Draft เก่าหรือลดขนาดรูปภาพ`
                        : `ไม่สามารถบันทึก ${label} ได้: ${error.message || 'Unknown error'}`
                    );
                }
                return false;
            }
        };

        const useDebouncedValue = (value, delay = 300) => {
            const [debouncedValue, setDebouncedValue] = useState(value);
            useEffect(() => {
                const timer = setTimeout(() => setDebouncedValue(value), delay);
                return () => clearTimeout(timer);
            }, [value, delay]);
            return debouncedValue;
        };

        const useDebouncedEffect = (effect, dependencies, delay = 500) => {
            useEffect(() => {
                const timer = setTimeout(effect, delay);
                return () => clearTimeout(timer);
            }, [...dependencies, delay]);
        };

        const readFileAsDataUrl = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(reader.error || new Error('อ่านไฟล์รูปภาพไม่สำเร็จ'));
            reader.readAsDataURL(file);
        });

        const loadImageElement = (src) => new Promise((resolve, reject) => {
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = () => reject(new Error('เปิดไฟล์รูปภาพไม่สำเร็จ'));
            image.src = src;
        });

        // Upload workflow is unchanged: local file -> FileReader -> Data URL.
        // The Data URL is resized before entering React state to protect LocalStorage quota.
        const optimizeLocalImageFile = async (file, kind = 'generic') => {
            if (!file?.type?.startsWith('image/')) throw new Error('กรุณาเลือกไฟล์รูปภาพ');
            const originalDataUrl = await readFileAsDataUrl(file);
            if (file.type === 'image/svg+xml' || file.type === 'image/gif') return originalDataUrl;

            const profiles = {
                profile: { maxWidth: 512, maxHeight: 512, mime: 'image/webp', quality: 0.84 },
                vehicle: { maxWidth: 1600, maxHeight: 1000, mime: 'image/webp', quality: 0.88 },
                qr: { maxWidth: 1000, maxHeight: 1000, mime: 'image/png', quality: 1 },
                logo: { maxWidth: 1200, maxHeight: 600, mime: 'image/png', quality: 1 },
                generic: { maxWidth: 1200, maxHeight: 1200, mime: 'image/webp', quality: 0.86 }
            };
            const profile = profiles[kind] || profiles.generic;
            const image = await loadImageElement(originalDataUrl);
            const ratio = Math.min(1, profile.maxWidth / image.naturalWidth, profile.maxHeight / image.naturalHeight);
            const width = Math.max(1, Math.round(image.naturalWidth * ratio));
            const height = Math.max(1, Math.round(image.naturalHeight * ratio));

            // Keep already-small lossless QR/logo files untouched when possible.
            if (ratio === 1 && ['qr', 'logo'].includes(kind) && file.size < 700000) return originalDataUrl;

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d', { alpha: true });
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(image, 0, 0, width, height);
            return canvas.toDataURL(profile.mime, profile.quality);
        };

        // B1.14 — DSP Calculator v26.06.2026: อัตราดอกเบี้ยช่วงต่อขยายสัญญาตามกลุ่มรถ
        const DSP_EXTENSION_RATE_CITY = 3.55;
        const DSP_EXTENSION_RATE_GENERAL = 3.19;
        const DSP_EXTENSION_NOTE = '*ค่างวดช่วงต่อขยายสัญญาขึ้นอยู่กับดอกเบี้ยในอนาคต ณ วันทำสัญญาต่อขยาย';
        const getDspExtensionRateByModel = (mKey) => (
            isCitySeriesModelKey(mKey) ? DSP_EXTENSION_RATE_CITY : DSP_EXTENSION_RATE_GENERAL
        );
        const isDspModelEligible = (mKey) => [
            ...CITY_SERIES_MODEL_KEYS,
            'Civic eHEV', 'Civic eHEV EL', 'HR-V eHEV', 'Accord eHEV',
            'CR-V eHEV', 'eN2', 'StepWgn eHEV'

        const getDspAllowedTerms = (mKey, dPct) => {
            if (!isDspModelEligible(mKey)) return [];
            if (mKey === 'eN2') return [60];
            return Number(dPct) < 10 ? [48, 60] : [48, 60, 84];
        };
        const getDspBalloonRateByModel = (mKey, term) => {
            if (mKey === 'eN2') return BALLOON_RATE_EN2_DSP[term] || 0;
            if (mKey === 'StepWgn eHEV') return BALLOON_RATE_STEPWGN[term] || 0;
            if (isCitySeriesModelKey(mKey)) return BALLOON_RATE_CITY[term] || 0;
            return BALLOON_RATE_OTHERS[term] || 0;

        const getDspRateByModel = (mKey, customerType, term) => {
            if (isCitySeriesModelKey(mKey)) {
                const normalized = normalizeCustomerType(customerType);
                const bucket = normalized === 'first_jobber'
                    ? 'firstJobber'
                    : (normalized === 'honda_youre_the_one' ? 'youreTheOne' : 'general');
                return DSP_RATE_CITY[bucket]?.[term] ?? null;
            }
            return DSP_RATE_GENERAL[term] ?? null;
        };
        const getDspIneligibleMessage = (mKey, dPct) => {
            if (!isDspModelEligible(mKey)) return 'ไม่เข้าเงื่อนไข DSP สำหรับรุ่นนี้';

        // FINANCE-TERM-REV-01 — แสดงงวดตามไฟแนนซ์/รุ่น/%ดาวน์จริง

        const CALCULATOR_BASE_TERM_OPTIONS = [12, 24, 36, 48, 60, 72, 84];

        const getBankRateRowForTerms = (selectedBank, mKey, dPct, gradeName = '') => {

            return resolveRateTier(table, dPct).row;

        const getAvailableFinanceTermOptions = ({

            if (!row) return base;

            // Krungsri HON.2026.10/V01: 90 งวด = City Sedan เท่านั้น (ไม่รวม City Hatchback)
            if (selectedBank === 'BAY' && isCitySedanModelKey(mKey) && row[90] !== undefined) base.push(90);

            const kkp99Models = ['New City', 'New City Regular', 'Civic eHEV', 'Civic eHEV EL', 'HR-V eHEV', 'CR-V eHEV', 'Accord eHEV', 'StepWgn eHEV', 'eN2'];
            if (selectedBank === 'KK' && kkp99Models.includes(mKey) && row[99] !== undefined) base.push(99);

            return [...new Set(base)].sort((a,b)=>a-b);
        };

        const getDefaultFinanceDisplayTerms = (availableTerms = []) => {

        const COMPARE_TERM_OPTIONS = [12, 24, 36, 48, 60, 72, 84];

        const normalizeCustomerType = (type = 'general') => {
            if (type === 'loyal_15' || type === 'first_jobber') return 'first_jobber';

            return 'general';

        const toLegacyCustomerType = (type = 'general') => {

        };
        const getCustomerTypeLabel = (type = 'general') => (
            COMPARE_CUSTOMER_OPTIONS.find(item => item.value === normalizeCustomerType(type))?.label || 'General / ลูกค้าทั่วไป'
        );
        const isCompareFinanceSelectable = (mKey, campaignId) => isCampaignFinanceSelectable(mKey, campaignId);
        const canUseHltcFirstJobberYoureTheOne = (mKey) => isCitySeriesModelKey(mKey);
        const canUseHltcSpecialOccupation = (mKey) => mKey !== 'eN2';

        // B1.16 — Single source of truth for interest-discount eligibility.
        // mode: campaign | standard | dsp | cash
        const getInterestDiscountEligibility = (mKey, mode = 'campaign', selectedBank = 'HLTC') => {
            const normalizedMode = mode || 'campaign';
            if (normalizedMode === 'cash') {
                return { customerType:false, specialOcc:false, hondaLoyalty:false, hondaCareSupport:false, beginning:false };
            }
            if (normalizedMode === 'dsp') {
                // DSP has its own City customer buckets; all other discount toggles are not layered on DSP.
                return {
                    customerType: isCitySeriesModelKey(mKey),
                    specialOcc: false,
                    hondaLoyalty: false,
                    hondaCareSupport: false,
                    beginning: false
                };
            }
            if (normalizedMode === 'standard') {
                return {
                    customerType: selectedBank === 'HLTC' && canUseHltcFirstJobberYoureTheOne(mKey),
                    specialOcc: selectedBank === 'KK' || (selectedBank === 'HLTC' && canUseHltcSpecialOccupation(mKey)),
                    // Business rule confirmed: Standard Rate cannot combine with these two Honda campaign discounts.
                    hondaLoyalty: false,
                    hondaCareSupport: false,
                    // Preserve existing finance logic: Beginning is applied as a separate layer where selected.
                    beginning: true
                };
            }
            // Promotional campaign rate path (CP001 / campaign table).
            return {
                customerType: canUseHltcFirstJobberYoureTheOne(mKey),
                specialOcc: canUseHltcSpecialOccupation(mKey),
                hondaLoyalty: true,
                hondaCareSupport: true,
                beginning: true

        const normalizeInterestDiscountSelection = ({
            mKey, mode = 'campaign', selectedBank = 'HLTC', customerType = 'general',

                isSpecialOcc: eligibility.specialOcc ? !!isSpecialOcc : false,
                isHondaLoyalty: eligibility.hondaLoyalty ? !!isHondaLoyalty : false,
                isHondaCareSupport: eligibility.hondaCareSupport ? !!isHondaCareSupport : false,
                paymentType: eligibility.beginning && paymentType === 'beginning' ? 'beginning' : 'ending'

        const useQuoteLog = () => {

            const dbRef = useRef(null);
            useEffect(() => {
                let unsub = null, cancelled = false;
                const timer = setTimeout(() => setReady(true), 10000);
                (async () => {
                    let db = null;
                    try { db = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('db') : null; } catch (e) { db = null; }
                    if (cancelled) return;
                    if (!db) { clearTimeout(timer); setReady(true); return; }
                    dbRef.current = db;
                    unsub = db.collection('quotes').orderBy('at', 'desc').limit(1000).onSnapshot(snap => {
                        clearTimeout(timer);
                        setMode('db');
                        setReady(true);
                        setEntries(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    }, () => {
                        clearTimeout(timer);
                        dbRef.current = null;
                        setMode('local');
                        setReady(true);
                        setEntries(readLocalQuoteLog());
                    });
                })();
                return () => { cancelled = true; clearTimeout(timer); if (unsub) unsub(); };

                const rec = JSON.parse(JSON.stringify({ ...entry, at: new Date().toISOString() }));
                if (dbRef.current) {
                    try { await dbRef.current.collection('quotes').doc().set(rec); return 'db'; }

            if (campaign && Number(campaign.supportValue || 0) > 0) {
                const base = Number(campaign.supportValue) || 0;
                const special = Number(campaign.specialSupportValue || 0) || 0;
                const keywords = Array.isArray(campaign.specialSupportKeywords) ? campaign.specialSupportKeywords : [];
                if (special > 0 && keywords.length) {
                    const haystack = `${modelKey} ${gradeName} ${colorName}`.toLowerCase();
                    if (keywords.some(keyword => haystack.includes(String(keyword || '').toLowerCase()))) return special;
                }
                return base;

            const match = name.match(/(?:ค่าช่วยเหลือการขาย|ช่วยเหลือการขาย|ช่วยขาย|ช่วยดาวน์)\s*([\d,]+)\s*(?:บาท)?/);

            const callbackName = `atHondaSheetBackend_${Date.now()}_${Math.floor(Math.random() * 100000)}`;
            const script = document.createElement('script');
            const separator = url.includes('?') ? '&' : '?';
            let timeoutId = null;
            const cleanup = () => {
                if (timeoutId) clearTimeout(timeoutId);
                try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
                if (script.parentNode) script.parentNode.removeChild(script);
            };

            window[callbackName] = (payload) => {
                cleanup();
                if (payload && payload.ok === false) {
                    reject(new Error(payload.message || payload.error || 'Google Sheet backend ส่ง error กลับมา'));

        const getGiftPriceFromBackend = (backend, giftName, modelKey, uiModel, gradeName) => {

            const modelKeys = getBackendModelKeys(modelKey, uiModel);
            const gradeKey = normalizeSheetKey(gradeName);
            const allKeys = ['all', 'ทุกรุ่น', 'ทุกเกรด', 'ot', ''];

            let rows = backend.giftPrices.filter(row => normalizeSheetKey(row.giftName) === giftKey);

            // รองรับการเลือกชื่อของแถมแบบสั้น เช่น "คิ้วกันสาด" แล้วไปจับกับ "คิ้วกันสาด CITY" ใน Sheet
            if (!rows.length && giftKey.length >= 2) {
                rows = backend.giftPrices.filter(row => {
                    const rowGift = normalizeSheetKey(row.giftName);
                    return rowGift.includes(giftKey) || giftKey.includes(rowGift);
                });
            }

            if (!rows.length) return null;

            const scoreRow = (row) => {
                const rowModelKeys = [row.model, row.modelCode].filter(Boolean).map(normalizeSheetKey);
                const rowGrade = normalizeSheetKey(row.grade || 'ALL');
                const modelScore = rowModelKeys.some(k => modelKeys.includes(k)) ? 100 : rowModelKeys.some(k => allKeys.includes(k)) ? 10 : -1000;
                const gradeScore = rowGrade === gradeKey ? 20 : allKeys.includes(rowGrade) ? 2 : -1000;
                const exactGiftBonus = normalizeSheetKey(row.giftName) === giftKey ? 5 : 0;
                return modelScore + gradeScore + exactGiftBonus;
            };

            const best = rows
                .map(row => ({ row, score: scoreRow(row) }))
                .filter(item => item.score > 0)
                .sort((a, b) => b.score - a.score)[0]?.row;

            if (!best) return null;
            return {
                price: best.price || 0,
                model: best.model || best.modelCode || 'ALL',
                grade: best.grade || 'ALL',

            const rowKeys = (item) => [normalizeSheetKey(item.model), compactSheetKey(item.model)].filter(Boolean);
            let row = rows.find(item => rowKeys(item).some(k => targetKeys.includes(k)));

            // fallback แบบยืดหยุ่น เผื่อใน Sheet พิมพ์ชื่อรุ่นต่างกัน เช่น CRV eHEV / CR-V e:HEV
            if (!row) {
                row = rows.find(item => {
                    const compact = compactSheetKey(item.model);
                    return targetKeys.some(k => {
                        const ck = compactSheetKey(k);
                        return ck.length >= 3 && (compact === ck || compact.includes(ck) || ck.includes(compact));
                    });
                });
            }

            if (!row) return null;
            const price = registrationType === 'corporate' ? row.corporatePrice : row.personalPrice;
            if (!price) return null;
            const backendMatched = !!(backend?.registrationFees || []).find(item => rowKeys(item).some(k => targetKeys.includes(k)));
            return {
                model: row.model || targetModel,
                price,
                type: registrationType,
                note: row.note || (backendMatched ? 'Google Sheet' : 'Default registration table')
            };
        };

        const getInterestRate = (mKey, opId, dPct, term, cType, isBeg, manualRate, isSpecialOcc, isHondaLoyalty, isHondaCareSupport, selectedBank = "HLTC", gradeName = '') => {
            // selectedBank is passed only for Standard Rate; campaign path passes null.
            const mode = selectedBank ? 'standard' : 'campaign';
            const hasManualRate = manualRate !== null && manualRate !== undefined && manualRate !== '' && !isNaN(manualRate);
            let baseRate = null;

            // Manual Interest is a BASE rate, not a final rate.
            // All eligible discount layers are applied after the manual override as well.
            if (hasManualRate) {
                baseRate = parseFloat(manualRate);
            } else if (mode === 'standard') {
                const bankRate = getBankRateFromTable(selectedBank, mKey, dPct, term, gradeName);
                if (bankRate !== null && bankRate !== undefined && !isNaN(bankRate)) baseRate = Number(bankRate);
            } else {
                const lookupTerm = term < 48 ? 48 : term;
                const mTbl = RATE_TABLE_MAP[mKey];
                if (mTbl) {
                    const opTbl = mTbl[opId] || mTbl["1"];
                    if (opTbl) {
                        const resolved = resolveRateTier(opTbl, dPct);
                        if (resolved.row && resolved.row[lookupTerm] !== undefined) baseRate = Number(resolved.row[lookupTerm]);
                        else return null;
                    }
                } else if (dPct >= 25) {
                    baseRate = 1.99;
                } else {
                    baseRate = 2.49;
                }
            }

            if (baseRate === null || baseRate === undefined || !Number.isFinite(Number(baseRate))) return null;

            const discountInfo = resolveInterestDiscounts({
                mKey, mode, selectedBank: selectedBank || 'HLTC', customerType: cType,
                isBeg, isSpecialOcc, isHondaLoyalty, isHondaCareSupport
            });
            const effectiveRate = Math.max(0, Number(baseRate) - discountInfo.total);
            return parseFloat(effectiveRate.toFixed(4));
        };

        const clampOfferLayout = (key, value, fallback) => {
            const limits = OFFER_LAYOUT_LIMITS[key] || { min:-99999, max:99999 };
            const parsed = Number(value);
            const safe = Number.isFinite(parsed) ? parsed : Number(fallback || 0);
            return Math.min(limits.max, Math.max(limits.min, safe));

            const coreFields = ['retailPrice','netPrice','discountAmount','downAmount','deliveryAmount','monthly','bank','campaign'];

        const offerCanvasDrawHMark = (ctx, image, x, y, width, height, color = '#111111') => {
            if (!image) return;
            ctx.save();
            const normalized = String(color || '').toLowerCase();
            if (normalized === '#fff' || normalized === '#ffffff' || normalized === 'white') ctx.filter = 'invert(1)';
            offerCanvasDrawImageContain(ctx, image, x, y, width, height, 1);
            ctx.restore();
        };


        // =====================================================================
        // OS-REV-23 / A5 — HEADER TEXT, BENEFIT ICONS & 3-COLUMN CONTACT
        // - Thai headline must never use per-character letter spacing because
        //   combining marks will separate from their base glyphs on Canvas.
        // - Benefit icons are drawn as vectors so they cannot disappear.
        // - Sales / QR / Dealer logo use three stable columns.
        // Search keyword: OS-REV-23-HEADER-ICONS-CONTACT
        // =====================================================================
        const offerCanvasFitSingleLineFont = (ctx, text, maxWidth, startSize, weight = 700, italic = false, minSize = 10) => {
            let size = Math.max(minSize, Number(startSize) || minSize);
            while (size > minSize) {
                ctx.font = offerCanvasFont(weight, size, italic);
                if (ctx.measureText(String(text || '')).width <= maxWidth) break;
                size -= 0.5;
            }
            return size;
        };

        const offerCanvasDrawDealerLogoFallback = (ctx, x, y, width, height, textColor, accentColor) => {
            const availableW = Math.max(40, width);
            const maxLogoH = Math.max(28, Math.min(height * .62, 58));
            let size = Math.max(18, Math.min(30, maxLogoH * .55));
            const groupSize = Math.max(7, Math.min(10, size * .34));
            ctx.save();
            ctx.textBaseline = 'top';
            ctx.textAlign = 'left';
            while (size > 16) {
                ctx.font = offerCanvasFont(800, size, false);
                const totalW = ctx.measureText('AT').width + ctx.measureText('Honda').width;
                if (totalW <= availableW) break;
                size -= .5;
            }
            ctx.font = offerCanvasFont(800, size, false);
            const atW = ctx.measureText('AT').width;
            const hondaW = ctx.measureText('Honda').width;
            const totalW = atW + hondaW;
            const startX = x + (availableW - totalW) / 2;
            const textY = y + Math.max(0, (maxLogoH - size) * .12);
            ctx.fillStyle = textColor || '#111111';
            ctx.fillText('AT', startX, textY);
            ctx.fillStyle = accentColor || '#cc0000';
            ctx.fillText('Honda', startX + atW, textY);

            const groupY = textY + size + 3;
            ctx.font = offerCanvasFont(600, groupSize, false);
            ctx.fillStyle = textColor || '#111111';
            ctx.textAlign = 'center';
            // Native fillText keeps Latin kerning stable; no manual letter-spacing.
            ctx.fillText('G  R  O  U  P', x + availableW / 2, groupY);
            ctx.restore();
        };

        const offerCanvasDrawBenefitIcon = (ctx, type, cx, cy, size = 18, color = '#ffffff') => {
            const s = Math.max(10, size);
            ctx.save();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = Math.max(1.4, s * .10);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            if (type === 'shield') {
                ctx.beginPath();
                ctx.moveTo(cx, cy - s * .46);
                ctx.lineTo(cx + s * .36, cy - s * .28);
                ctx.lineTo(cx + s * .30, cy + s * .18);
                ctx.quadraticCurveTo(cx, cy + s * .48, cx, cy + s * .48);
                ctx.quadraticCurveTo(cx, cy + s * .48, cx - s * .30, cy + s * .18);
                ctx.lineTo(cx - s * .36, cy - s * .28);
                ctx.closePath();
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx - s * .15, cy);
                ctx.lineTo(cx - s * .02, cy + s * .13);
                ctx.lineTo(cx + s * .19, cy - s * .13);
                ctx.stroke();
            } else if (type === 'wrench') {
                ctx.beginPath();
                ctx.moveTo(cx - s * .34, cy + s * .34);
                ctx.lineTo(cx + s * .12, cy - s * .12);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx - s * .34, cy + s * .34, s * .10, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx + s * .08, cy - s * .18);
                ctx.quadraticCurveTo(cx + s * .30, cy - s * .45, cx + s * .44, cy - s * .28);
                ctx.lineTo(cx + s * .24, cy - s * .08);
                ctx.quadraticCurveTo(cx + s * .07, cy - s * .08, cx + s * .08, cy - s * .18);
                ctx.stroke();
            } else if (type === 'clock') {
                ctx.beginPath();
                ctx.arc(cx, cy, s * .40, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx, cy - s * .23);
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + s * .20, cy + s * .10);
                ctx.stroke();
            } else {
                // Quality badge / seal
                const spikes = 12;
                ctx.beginPath();
                for (let i = 0; i < spikes * 2; i++) {
                    const angle = -Math.PI / 2 + i * Math.PI / spikes;
                    const r = i % 2 ? s * .33 : s * .44;
                    const px = cx + Math.cos(angle) * r;
                    const py = cy + Math.sin(angle) * r;
                    if (!i) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx - s * .16, cy);
                ctx.lineTo(cx - s * .02, cy + s * .14);
                ctx.lineTo(cx + s * .20, cy - s * .14);
                ctx.stroke();
            }
            ctx.restore();
        };

        const getOfferCanvasScaledTypography = (config, layout) => {
            const raw = { ...DEFAULT_TEXT_STYLES, ...(config.textStyles || {}) };
            const scaleText = (value, scale = 1, min = 7) => Math.max(min, Math.round(Number(value || 0) * scale * 100) / 100);
            return {
                ...raw,
                title:scaleText(raw.title, Math.max(layout.primaryTextScale, layout.supportTextScale), 20),
                subtitle:scaleText(raw.subtitle, layout.supportTextScale, 10),
                promoHeadline:scaleText(raw.promoHeadline, layout.campaignTextScale, 10),
                promoText:scaleText(raw.promoText, layout.campaignTextScale, 12),
                model:scaleText(raw.model, layout.primaryTextScale, 9),
                grade:scaleText(raw.grade, layout.primaryTextScale, 16),
                label:scaleText(raw.label, layout.labelTextScale, 8),
                standardValue:scaleText(raw.standardValue, layout.primaryTextScale, 14),
                highlightValue:scaleText(raw.highlightValue, layout.primaryTextScale, 20),
                monthlyValue:scaleText(raw.monthlyValue, layout.primaryTextScale, 20),
                termValue:scaleText(raw.termValue, layout.supportTextScale, 10),
                vehicleImageScale:raw.vehicleImageScale,
                vehicleImageHeight:scaleText(raw.vehicleImageHeight, layout.vehicleScale, 30),
                salesName:scaleText(raw.salesName, layout.contactScale, 14),
                salesInfo:scaleText(raw.salesInfo, layout.contactScale, 10),
                cta:scaleText(raw.cta, layout.contactScale, 8),
                footer:scaleText(raw.footer, layout.supportTextScale, 7),
                logoSize:scaleText(raw.logoSize, layout.contactScale, 30)
            };
        };

        const renderOfferStudioToCanvas = async (canvasElement, config) => {
            if (!canvasElement) throw new Error('ไม่พบ Canvas ของ Offer Studio');
            const canvasConfig = config?.canvas || OFFER_CANVAS_PRESETS.portrait;
            const width = Math.max(1, Math.round(Number(canvasConfig.width) || 1080));
            const height = Math.max(1, Math.round(Number(canvasConfig.height) || 1350));
            canvasElement.width = width;
            canvasElement.height = height;
            const ctx = canvasElement.getContext('2d', { alpha:true });
            if (!ctx) throw new Error('Browser ไม่รองรับ Canvas 2D');

            await waitForOfferCanvasFonts();
            const cards = Array.isArray(config?.cards) ? config.cards : [];
            const profile = config?.salesProfile || {};
            const imageSources = [HONDA_H_MARK_DATA_URI, profile.photo, profile.qr, profile.dealerLogo, ...cards.map(card => card.vehicleImage)].filter(Boolean);
            const imageEntries = await Promise.all([...new Set(imageSources)].map(async src => [src, await loadOfferCanvasImage(src)]));
            const images = new Map(imageEntries);

            ctx.clearRect(0, 0, width, height);
            if (config.backgroundMode !== 'transparent') {
                ctx.fillStyle = config.backgroundColor || '#ffffff';
                ctx.fillRect(0, 0, width, height);
            }
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.textBaseline = 'top';

            if (!cards.length) {
                offerCanvasDrawText(ctx, 'เลือกรุ่นรถเพื่อดูตัวอย่าง', { x:0, y:height / 2 - 20, maxWidth:width, size:24, weight:500, color:'#94a3b8', align:'center' });
                return { issues:[], width, height };
            }

            const issues = [];
            const f = config.fields || DEFAULT_OFFER_FIELDS;
            const layout = resolveOfferLayoutProfile(config);
            const ts = getOfferCanvasScaledTypography(config, layout);
            const fw = OFFER_FONT_WEIGHTS;
            const isStory = height > width * 1.55;
            const count = cards.length;
            const showVehicleImage = !!f.vehicleImage;
            const amountLabel = config.displayMode === 'delivery' ? 'ค่าใช้จ่ายวันรับรถ' : 'ยอดดาวน์';
            const padX = layout.pagePaddingX;
            const padY = layout.pagePaddingY;
            const safeBottom = Math.max(12, padY - 4) + 8;
            const innerWidth = width - padX * 2;
            const headerVisible = !!(f.promoBadge || (f.title && config.title) || (f.subtitle && config.subtitle) || f.hondaLogo);

            let headerHeight = 0;
            if (headerVisible) {
                const titleHeight = (f.subtitle && config.subtitle ? ts.subtitle * 1.2 + 4 : 0) + (f.title && config.title ? ts.title * 1.15 : 0) + 4;
                headerHeight = Math.max(f.promoBadge ? 72 : 0, f.hondaLogo ? Math.max(56, ts.logoSize * .65) : 0, titleHeight);
            }

            const benefitsHeight = f.benefits ? Math.max(38, Math.round(54 * layout.contactScale)) : 0;
            const showSales = !!(f.salesPhoto || f.salesName || f.phone || f.line || f.qr || f.dealerLogo || f.cta);
            const salesHeight = showSales ? Math.max(82, Math.round((isStory ? 140 : 115) * layout.contactScale)) : 0;
            const footerHeight = (f.terms || f.updatedAt) ? Math.max(22, Math.ceil(ts.footer * 2.85)) : 0;
            const bottomGaps = (benefitsHeight ? Math.max(5, layout.sectionGap) : 0) + (salesHeight ? Math.max(5, layout.sectionGap) : 0) + (footerHeight ? 6 : 0);
            const contentTop = padY + headerHeight + (headerVisible ? layout.headerGap : 0);
            const contentBottom = height - safeBottom - OFFER_CANVAS_BOTTOM_STRIP_PX - benefitsHeight - salesHeight - footerHeight - bottomGaps;
            const contentHeight = contentBottom - contentTop;
            if (contentHeight < 80) issues.push('พื้นที่ข้อมูลรถไม่เพียงพอ');

            // Header
            if (headerVisible) {
                const y = padY;
                const promoWidth = f.promoBadge ? Math.min(layout.promoWidth, innerWidth * .36) : 0;
                const logoWidth = f.hondaLogo ? Math.min(layout.logoColumnWidth, innerWidth * .28) : 0;
                const centerX = padX + (promoWidth ? promoWidth + layout.headerGap : 0);
                const centerWidth = innerWidth - (promoWidth ? promoWidth + layout.headerGap : 0) - (logoWidth ? logoWidth + layout.headerGap : 0);
                if (f.promoBadge) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(padX, y);
                    ctx.lineTo(padX + promoWidth, y);
                    ctx.lineTo(padX + promoWidth * .91, y + Math.min(72, headerHeight));
                    ctx.lineTo(padX, y + Math.min(72, headerHeight));
                    ctx.closePath();
                    const gradient = ctx.createLinearGradient(padX, y, padX + promoWidth, y + 72);
                    gradient.addColorStop(0, config.accentColor || '#cc0000');
                    gradient.addColorStop(1, '#9b0000');
                    ctx.fillStyle = gradient;
                    ctx.fill();
                    ctx.restore();
                    offerCanvasDrawText(ctx, config.promoHeadline || 'SPECIAL CAMPAIGN', { x:padX + 16, y:y + 12, maxWidth:promoWidth - 40, size:ts.promoHeadline, weight:fw.promoHeadline, color:'#ffffff', italic:true, maxLines:1, lineHeight:1.05 });
                    offerCanvasDrawText(ctx, config.promoText || '', { x:padX + 16, y:y + 38, maxWidth:promoWidth - 40, size:ts.promoText, weight:fw.promoText, color:'#ffe400', maxLines:1, lineHeight:1.05 });
                }
                let titleY = y + 2;
                if (f.subtitle && config.subtitle) {
                    const result = offerCanvasDrawText(ctx, config.subtitle, { x:centerX, y:titleY, maxWidth:centerWidth, size:ts.subtitle, weight:fw.subtitle, color:config.textColor, align:'center', maxLines:2, lineHeight:1.15 });
                    titleY = result.bottom + 4;
                }
                if (f.title && config.title) {
                    // A5: Do not use manual letterSpacing on Thai combining glyphs.
                    // Use the real italic Prompt glyphs and fit the line as a whole.
                    const titleWeight = Math.min(Number(fw.title) || 700, 700);
                    const titleSize = offerCanvasFitSingleLineFont(ctx, config.title, centerWidth, ts.title, titleWeight, true, Math.max(18, ts.title * .72));
                    offerCanvasDrawText(ctx, config.title, { x:centerX, y:titleY, maxWidth:centerWidth, size:titleSize, weight:titleWeight, color:config.textColor, italic:true, align:'center', maxLines:1, lineHeight:1.12 });
                }
                if (f.hondaLogo) {
                    const hImage = images.get(HONDA_H_MARK_DATA_URI);
                    offerCanvasDrawHMark(ctx, hImage, width - padX - logoWidth, y, logoWidth, Math.min(headerHeight, Math.max(56, ts.logoSize)), config.textColor);
                }
            }

            // Cards
            const columns = Math.max(1, Math.min(count, layout.columns || 1));
            const rows = Math.ceil(count / columns);
            const cardGap = layout.cardGap;
            const cardWidth = (innerWidth - cardGap * (columns - 1)) / columns;
            const cardHeight = (contentHeight - cardGap * (rows - 1)) / rows;

            const drawInfoSection = ({ x, y, width:sectionWidth, label, value, labelSize, valueSize, labelColor, valueColor, labelWeight, valueWeight, divider = true, large = false }) => {
                let cursor = y;
                if (divider) {
                    cursor += layout.dividerBefore;
                    ctx.fillStyle = '#e5e7eb';
                    ctx.fillRect(x, cursor, sectionWidth, 1);
                    cursor += 1 + layout.dividerAfter;
                }
                if (label !== undefined && label !== null) {
                    const labelResult = offerCanvasDrawText(ctx, label, { x, y:cursor, maxWidth:sectionWidth, size:labelSize, weight:labelWeight, color:labelColor, lineHeight:1.22, maxLines:2 });
                    cursor = labelResult.bottom + 3;
                }
                if (value !== undefined && value !== null) {
                    const valueResult = offerCanvasDrawText(ctx, value, { x, y:cursor, maxWidth:sectionWidth, size:valueSize, weight:valueWeight, color:valueColor, lineHeight:large ? 1.08 : 1.12, maxLines:2 });
                    cursor = valueResult.bottom + (large ? 5 : 3);
                }
                return cursor;
            };

            cards.forEach((card, index) => {
                const col = index % columns;
                const row = Math.floor(index / columns);
                const cardX = padX + col * (cardWidth + cardGap);
                const cardY = contentTop + row * (cardHeight + cardGap);
                offerCanvasFillRoundRect(ctx, cardX, cardY, cardWidth, cardHeight, 14, config.cardColor || '#ffffff', '#dfe3e8', 1);
                ctx.save();
                offerCanvasRoundRectPath(ctx, cardX, cardY, cardWidth, cardHeight, 14);
                ctx.clip();

                const p = Math.max(6, layout.cardPadding);
                const x = cardX + p;
                const maxWidth = cardWidth - p * 2;
                const maxBottom = cardY + cardHeight - p;
                let y = cardY + p;
                const results = (config.selectedTerms || []).map(term => ({ term, result:card.installments?.[term] }));
                const firstValid = results.find(item => item.result && !item.result.invalid);
                const primaryMonthly = firstValid?.result?.subsidyAmount > 0 && firstValid?.result?.monthlyNet > 0 ? firstValid.result.monthlyNet : firstValid?.result?.monthly;
                const visibleInfoCount = [f.retailPrice, f.netPrice, f.discountAmount && Number(card.discountAmount || 0) > 0, f.downAmount, f.deliveryAmount, f.monthly, f.bank && card.bankLabel, f.campaign && card.campaignName].filter(Boolean).length;
                const autoBoost = showVehicleImage ? 0 : Math.max(0, 6 - visibleInfoCount) * (count >= 4 ? 1.8 : 2.5);
                const gradeSize = Math.round((ts.grade || DEFAULT_TEXT_STYLES.grade) + autoBoost + (!showVehicleImage && count === 1 ? 7 : 0) - (columns >= 4 ? 2 : 0));
                const modelSize = Math.round((ts.model || DEFAULT_TEXT_STYLES.model) + (!showVehicleImage ? 1.5 : 0) + (visibleInfoCount <= 3 ? 1 : 0));
                const highlightSize = Math.round((ts.highlightValue || DEFAULT_TEXT_STYLES.highlightValue) + autoBoost + (!showVehicleImage && count === 1 ? 8 : 0) - (columns >= 4 ? 4 : 0));
                const monthlySize = Math.round((ts.monthlyValue || DEFAULT_TEXT_STYLES.monthlyValue) + autoBoost + (!showVehicleImage && count === 1 ? 8 : 0) - (columns >= 4 ? 4 : 0));
                const standardSize = Math.round((ts.standardValue || DEFAULT_TEXT_STYLES.standardValue) + autoBoost * .5 - (columns >= 4 ? 3 : 0));
                const labelSize = Math.round((ts.label || DEFAULT_TEXT_STYLES.label) + (!showVehicleImage ? 1 : 0));
                const termSize = Math.round((ts.termValue || DEFAULT_TEXT_STYLES.termValue) + autoBoost * .25);

                if (f.model) {
                    const result = offerCanvasDrawText(ctx, String(card.model || '').toUpperCase(), { x, y, maxWidth, size:modelSize, weight:fw.model, color:config.textColor, lineHeight:1.08, maxLines:3, letterSpacing:.25 });
                    y = result.bottom + 2;
                }
                if (f.grade) {
                    const result = offerCanvasDrawText(ctx, card.grade || '', { x, y, maxWidth, size:gradeSize, weight:fw.grade, color:config.textColor, italic:true, lineHeight:1.08, maxLines:3 });
                    y = result.bottom + (showVehicleImage ? 3 : 5);
                }
                if (!showVehicleImage && f.color && card.color) {
                    const result = offerCanvasDrawText(ctx, String(card.color).replace(/^สี\s*/, ''), { x, y, maxWidth, size:Math.max(labelSize + 1, 12), weight:fw.label, color:config.secondaryTextColor, lineHeight:1.2, maxLines:2 });
                    y = result.bottom + 4;
                }

                if (showVehicleImage) {
                    const imageHeight = Math.max(30, Number(ts.vehicleImageHeight || DEFAULT_TEXT_STYLES.vehicleImageHeight));
                    const imageWidth = maxWidth * Math.max(.20, Math.min(1.4, Number(ts.vehicleImageScale || DEFAULT_TEXT_STYLES.vehicleImageScale) / 100));
                    const imageX = x + (maxWidth - imageWidth) / 2;
                    const vehicleImage = images.get(card.vehicleImage);
                    if (!offerCanvasDrawImageContain(ctx, vehicleImage, imageX, y, imageWidth, imageHeight, .78)) {
                        offerCanvasDrawCarPlaceholder(ctx, imageX, y, imageWidth, imageHeight);
                    }
                    y += imageHeight + 4;
                    if (f.color && card.color) {
                        const colorResult = offerCanvasDrawText(ctx, String(card.color).replace(/^สี\s*/, ''), { x, y, maxWidth, size:Math.max(9, labelSize - 1), weight:fw.label, color:config.secondaryTextColor, lineHeight:1.2, maxLines:2 });
                        y = colorResult.bottom + Math.max(2, layout.sectionGap);
                    }
                } else {
                    y += Math.max(3, layout.sectionGap);
                }

                if (f.retailPrice) y = drawInfoSection({ x, y, width:maxWidth, divider:false, label:'ราคาปกติ', value:formatCurrency(card.retailPrice || card.netPrice || 0), labelSize, valueSize:standardSize, labelColor:config.secondaryTextColor, valueColor:config.textColor, labelWeight:fw.label, valueWeight:fw.standardValue });
                if (f.netPrice) y = drawInfoSection({ x, y, width:maxWidth, label:'ราคาสุทธิ', value:formatCurrency(card.netPrice || card.retailPrice || 0), labelSize, valueSize:standardSize, labelColor:config.secondaryTextColor, valueColor:config.textColor, labelWeight:fw.label, valueWeight:fw.standardValue });
                if (f.discountAmount && Number(card.discountAmount || 0) > 0) y = drawInfoSection({ x, y, width:maxWidth, label:'ส่วนลดรวม', value:formatCurrency(card.discountAmount), labelSize, valueSize:standardSize, labelColor:config.secondaryTextColor, valueColor:config.accentColor, labelWeight:fw.label, valueWeight:fw.highlightValue });
                if (f.downAmount) y = drawInfoSection({ x, y, width:maxWidth, label:'เงินดาวน์ตามสัญญา', value:formatCurrency(card.downAmount || 0), labelSize, valueSize:standardSize, labelColor:config.secondaryTextColor, valueColor:config.textColor, labelWeight:fw.label, valueWeight:fw.standardValue });
                if (f.deliveryAmount) y = drawInfoSection({ x, y, width:maxWidth, label:amountLabel, value:formatCurrency(card.displayAmount || 0), labelSize, valueSize:highlightSize, labelColor:config.secondaryTextColor, valueColor:config.accentColor, labelWeight:fw.label, valueWeight:fw.highlightValue, large:true });

                if (f.monthly) {
                    y += layout.dividerBefore;
                    ctx.fillStyle = '#e5e7eb';
                    ctx.fillRect(x, y, maxWidth, 1);
                    y += 1 + layout.dividerAfter;
                    if (config.selectedTerms?.length === 1 && firstValid) {
                        const labelResult = offerCanvasDrawText(ctx, `ผ่อนเริ่มต้น ${firstValid.term} งวด`, { x, y, maxWidth, size:labelSize, weight:fw.label, color:config.secondaryTextColor, lineHeight:1.22, maxLines:2 });
                        y = labelResult.bottom + 4;
                        const valueResult = offerCanvasDrawText(ctx, formatCurrency(primaryMonthly), { x, y, maxWidth, size:Math.max(monthlySize, 20), weight:fw.monthlyValue, color:config.textColor, lineHeight:1.08, maxLines:1 });
                        y = valueResult.bottom + 5;
                    } else {
                        for (const { term, result } of results) {
                            const value = result?.invalid || !result ? '-' : formatCurrency(result?.subsidyAmount > 0 && result?.monthlyNet > 0 ? result.monthlyNet : result.monthly);
                            const valueWidth = ctx.measureText(value).width;
                            offerCanvasDrawText(ctx, `ผ่อน ${term} งวด`, { x, y, maxWidth:Math.max(30, maxWidth - valueWidth - 12), size:Math.max(termSize - 1, 11), weight:fw.label, color:config.secondaryTextColor, lineHeight:1.15, maxLines:1 });
                            offerCanvasDrawText(ctx, value, { x, y, maxWidth, size:termSize, weight:fw.termValue, color:result?.invalid ? '#be123c' : config.textColor, align:'right', lineHeight:1.15, maxLines:1 });
                            y += Math.max(termSize, termSize - 1) * 1.15 + (showVehicleImage ? 4 : 6);
                        }
                    }
                }

                if (f.bank && card.bankLabel) {
                    const bank = offerCanvasDrawText(ctx, `ไฟแนนซ์: ${card.bankLabel}`, { x, y, maxWidth, size:Math.max(ts.label * layout.supportTextScale, 9), weight:fw.label, color:config.secondaryTextColor, lineHeight:1.32, maxLines:3 });
                    y = bank.bottom + 3;
                }
                if (f.campaign && card.campaignName) {
                    const campaign = offerCanvasDrawText(ctx, card.campaignName, { x, y, maxWidth, size:Math.max(ts.label * layout.campaignTextScale, 8), weight:fw.label, color:config.secondaryTextColor, lineHeight:1.38, maxLines:6 });
                    y = campaign.bottom + 3;
                }

                if (y > maxBottom + 1) issues.push(`ข้อมูลรถลำดับ ${index + 1} เกินกรอบ ${Math.ceil(y - maxBottom)}px`);
                ctx.restore();
            });

            let bottomY = contentBottom + (benefitsHeight ? Math.max(5, layout.sectionGap) : 0);

            // Benefits
            if (f.benefits) {
                offerCanvasFillRoundRect(ctx, padX, bottomY, innerWidth, benefitsHeight, 2, '#050505');
                const items = [
                    ['shield', 'ฟรี', 'ประกันภัยชั้น 1 ปี'],
                    ['wrench', 'ค่าบริการเช็กระยะ', 'ตามเงื่อนไขแคมเปญ'],
                    ['clock', 'ช่วยเหลือฉุกเฉิน', '24 ชม.'],
                    ['quality', 'รับประกันคุณภาพรถใหม่', 'ตามเงื่อนไขบริษัท']
                ];
                const itemWidth = innerWidth / 4;
                items.forEach(([iconType, head, sub], index) => {
                    const ix = padX + index * itemWidth;
                    if (index) {

                const innerY = bottomY + Math.max(7, Math.round(12 * layout.contactScale));

                const innerH = salesHeight - Math.max(14, Math.round(24 * layout.contactScale));

        const StickerBuilderModal = ({

            const firstAvailableSource = sourceAvailability[initialSource] > 0

            const [fileName, setFileName] = useState(defaultFileName || 'Honda_Offer');
            const [canvasPreset, setCanvasPreset] = useState(initialCanvasPreset);
            const [customCanvasWidth, setCustomCanvasWidth] = useState((savedDraft.canvas && savedDraft.canvas.width) || initialCanvas.width);

            const [displayMode, setDisplayMode] = useState('delivery');
            const [selectedTerms, setSelectedTerms] = useState([84]);
            const [compareDownPct, setCompareDownPct] = useState(normalizedDownOptions[0] || 25);
            const [displayPreset, setDisplayPreset] = useState('standard');
            const [fields, setFields] = useState({ ...DEFAULT_OFFER_FIELDS });
            const [accentColor, setAccentColor] = useState(savedTheme.accentColor || '#cc0000');

            const [selectedCardIds, setSelectedCardIds] = useState([]);
            const [amountOverrides, setAmountOverrides] = useState({});
            const [imageOverrides, setImageOverrides] = useState({});
            const [salesProfile, setSalesProfile] = useState({

                line: savedProfile.line || consultantLine || '',

            // OS-REV-19-TWO-LAYER-RENDERER:

            const previewOfferRenderRef = useRef(null);
            const exportOfferRenderRef = useRef(null);

            const offerPixelCanvasRef = useRef(null);
            const offerPixelBlobRef = useRef(null);

            const [isSavingPreview, setIsSavingPreview] = useState(false);
            const [layoutMode, setLayoutMode] = useState(savedDraft.layoutMode === 'manual' ? 'manual' : 'auto');
            const [layoutSettings, setLayoutSettings] = useState({ ...DEFAULT_OFFER_LAYOUT_SETTINGS, ...(savedDraft.layoutSettings || {}) });
            const [autoFitLevel, setAutoFitLevel] = useState(0);
            const [autoFitState, setAutoFitState] = useState({ status:'measuring', issues:[], fitLevel:0 });
            const autoFitStateRef = useRef(autoFitState);
            useEffect(() => { autoFitStateRef.current = autoFitState; }, [autoFitState]);
            const [textStyles, setTextStyles] = useState({ ...DEFAULT_TEXT_STYLES, ...(savedTheme.textStyles || {}), ...(savedDraft.textStyles || {}) });

            const cards = useMemo(() => getSourceCards(sourceMode, compareDownPct) || [], [sourceMode, compareDownPct, getSourceCards]);

            useEffect(() => {

            const toggleTerm = (term) => {

            const toggleCard = (cardId) => {

            const applyDisplayPreset = (key) => {

            const applyTheme = (preset) => {

                if (backgroundMode === 'solid') setBackgroundColor(preset.background);

            const buildConfig = () => {
                const chosenCards = cards
                    .filter(card => selectedCardIds.includes(String(card.id)))
                    .slice(0, 4)
                    .map(card => {
                        const key = String(card.id);
                        const raw = String(amountOverrides[key] ?? '').replace(/,/g, '').trim();
                        const parsed = raw === '' ? 0 : parseFloat(raw);
                        const hasImageOverride = Object.prototype.hasOwnProperty.call(imageOverrides, key);
                        return {
                            ...card,
                            displayAmount: isNaN(parsed) ? 0 : parsed,
                            // null/empty override means the user intentionally removed the image.
                            vehicleImage: hasImageOverride ? (imageOverrides[key] || '') : (card.vehicleImage || '')
                        };
                    });
                return {
                    fileName: fileName.trim() || 'Honda_Offer',
                    sourceMode,
                    sourceLabel: getStickerSourceLabel(sourceMode),
                    canvasPreset,
                    canvas: { width: Number(customCanvasWidth) || OFFER_CANVAS_PRESETS[canvasPreset].width, height: Number(customCanvasHeight) || OFFER_CANVAS_PRESETS[canvasPreset].height, label: OFFER_CANVAS_PRESETS[canvasPreset].label },
                    title: title.trim(),
                    subtitle: subtitle.trim(),
                    promoHeadline: promoHeadline.trim(),
                    promoText: promoText.trim(),
                    displayMode,
                    displayPreset,
                    selectedTerms: [...selectedTerms].sort((a,b)=>a-b),
                    fields,

                    textColor,
                    secondaryTextColor,
                    cardColor,
                    backgroundMode,
                    backgroundColor,
                    salesProfile,
                    cards: chosenCards,
                    textStyles,
                    layoutMode,

                    updatedAt: new Date().toLocaleDateString('th-TH', { day:'numeric', month:'short', year:'2-digit' })
                };
            };

            const handleOpenAIStudio = () => {
                const source = buildConfig();
                // Shallow-copy every mutable branch while preserving image Data URL
                // strings. The AI modal receives a frozen point-in-time snapshot.
                const snapshot = {
                    ...source,

                    canvas:{ ...(source.canvas || {}) },

                    selectedTerms:[...(source.selectedTerms || [])],
                    cards:(source.cards || []).map(card => ({

                            ? { ...card.installments }
