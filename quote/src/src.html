            const rawPreviewConfig = useMemo(buildConfig, [
                cards, selectedCardIds, amountOverrides, imageOverrides, fileName, sourceMode, canvasPreset, customCanvasWidth, customCanvasHeight,
                title, subtitle, promoHeadline, promoText, displayMode, displayPreset, selectedTerms, fields, accentColor, textColor,
                secondaryTextColor, cardColor, backgroundMode, backgroundColor, salesProfile, textStyles, layoutMode, layoutSettings
            ]);

            // A3 uses section-priority fit levels. Preview and Export receive the
            // same resolved layout profile and therefore the same column/gap choices.
            const previewConfig = useMemo(() => ({
                ...rawPreviewConfig,

                layoutSettings,

            }), [rawPreviewConfig, layoutMode, layoutSettings, autoFitLevel]);

            const resolvedLayoutProfile = useMemo(() => resolveOfferLayoutProfile(previewConfig), [previewConfig]);

            useEffect(() => {
                setAutoFitLevel(0);
                setAutoFitState({ status:'measuring', issues:[], fitLevel:0 });
            }, [rawPreviewConfig, layoutMode, layoutSettings]);

            const waitForOfferRendererAssets = async (root) => {
                if (!root) return;

                    try {

                        ]));

                }
                const images = Array.from(root.querySelectorAll('img'));
                await Promise.all(images.map(img => {
                    if (img.complete && img.naturalWidth > 0) {
                        return img.decode ? img.decode().catch(() => undefined) : Promise.resolve();

                    return new Promise(resolve => {
                        const done = () => resolve();

            // Audit uses the full-resolution export renderer, not the scaled preview.
            // It checks root bounds, each major section, every vehicle card and the
            // bottom safe area. No PNG is created while content is clipped.
            // OS-REV-20-OFFER-LAYOUT-FIX:
            // Browser text metrics may produce harmless 1–6px scroll differences even
            // when every visible pixel is inside the renderer. The old audit treated
            // those fractional differences as a hard overflow. This audit blocks only
            // real clipped content or nodes whose visual bounds leave the canvas.
            const inspectOfferLayout = (root) => {
                if (!root) return { issues:['ไม่พบ Export Renderer'], overflowPx:9999 };
                const issues = [];
                const rootRect = root.getBoundingClientRect();
                const boundsTolerance = 6;
                const clipTolerance = 10;
                let overflowPx = 0;

                const clippedAxis = (value) => ['hidden', 'clip', 'auto', 'scroll'].includes(String(value || '').toLowerCase());

                const inspectNode = (node, label) => {
                    const rect = node.getBoundingClientRect();
                    const style = window.getComputedStyle(node);
                    const bottomOverflow = Math.max(0, rect.bottom - rootRect.bottom);
                    const rightOverflow = Math.max(0, rect.right - rootRect.right);
                    const leftOverflow = Math.max(0, rootRect.left - rect.left);
                    const topOverflow = Math.max(0, rootRect.top - rect.top);
                    const scrollOverflowY = Math.max(0, node.scrollHeight - node.clientHeight);
                    const scrollOverflowX = Math.max(0, node.scrollWidth - node.clientWidth);

                    overflowPx = Math.max(overflowPx, bottomOverflow, rightOverflow, leftOverflow, topOverflow);
                    if (bottomOverflow > boundsTolerance) issues.push(`${label} เกินขอบล่าง ${Math.ceil(bottomOverflow)}px`);
                    if (rightOverflow > boundsTolerance || leftOverflow > boundsTolerance) issues.push(`${label} เกินขอบด้านข้าง`);
                    if (topOverflow > boundsTolerance) issues.push(`${label} เกินขอบบน`);

                    const clipsY = clippedAxis(style.overflowY) || clippedAxis(style.overflow);
                    const clipsX = clippedAxis(style.overflowX) || clippedAxis(style.overflow);
                    if (clipsY && scrollOverflowY > clipTolerance) {
                        overflowPx = Math.max(overflowPx, scrollOverflowY);
                        issues.push(`${label} ถูกตัดด้านล่าง ${Math.ceil(scrollOverflowY)}px`);
                    }
                    if (clipsX && scrollOverflowX > clipTolerance) {
                        overflowPx = Math.max(overflowPx, scrollOverflowX);
                        issues.push(`${label} ถูกตัดด้านข้าง ${Math.ceil(scrollOverflowX)}px`);
                    }
                };

                // Root itself is fixed-size and overflow:hidden. Ignore only the small
                // safe-area / fractional metric allowance; block meaningful overflow.
                const rootOverflowY = Math.max(0, root.scrollHeight - root.clientHeight);
                const rootOverflowX = Math.max(0, root.scrollWidth - root.clientWidth);
                if (rootOverflowY > clipTolerance) {
                    overflowPx = Math.max(overflowPx, rootOverflowY);
                    issues.push(`ภาพรวมเกินขอบล่าง ${Math.ceil(rootOverflowY)}px`);
                }
                if (rootOverflowX > clipTolerance) {
                    overflowPx = Math.max(overflowPx, rootOverflowX);
                    issues.push(`ภาพรวมเกินขอบด้านข้าง ${Math.ceil(rootOverflowX)}px`);
                }

                root.querySelectorAll('[data-offer-info-section]').forEach((section, index) => {

                    const value = section.querySelector('[data-offer-value]');
                    if (divider && label) {
                        const d = divider.getBoundingClientRect();
                        const l = label.getBoundingClientRect();
                        if (d.bottom > l.top - 1) issues.push(`เส้นแบ่งทับข้อความลำดับ ${index + 1}`);
                    }
                    if (label && value) {
                        const l = label.getBoundingClientRect();
                        const v = value.getBoundingClientRect();
                        if (l.bottom > v.top - 1) issues.push(`ป้ายกำกับชนตัวเลขลำดับ ${index + 1}`);
                    }
                });

                    const blocks = Array.from(body.children).filter(node => node.getBoundingClientRect().height > 0);

                    const stripRect = bottomStrip.getBoundingClientRect();

                return { issues:[...new Set(issues)], overflowPx };

            if (type === 'shield') return <svg {...common}><path d="M12 3l7 3.5v5.2c0 4.4-2.8 8.3-7 9.3-4.2-1-7-4.9-7-9.3V6.5L12 3z"/><path d="M9 12l2 2 4-4"/></svg>;

        // =====================================================================

        const OfferInfoSection = memo(({

        const InstallmentStickerCanvas = ({ config, previewMode = false, rootRef = null }) => {

        // =====================================================================
        // ZONE 2B: PURE FINANCE CALCULATION ENGINE
        // Moved outside App so React does not recreate these functions on render.
        // Search keyword: ARCH-ZONE-02B
        // =====================================================================
        const calculateInstallmentDetail = (
            uiModel, totalPrice, priceAdjustment, downPct, term, campaignId, campaignName, campaignType,
            customerType, paymentType, isSpecialOcc, isHondaLoyalty, isHondaCareSupport, manualRate, extensionInterest, forcedFinanceType,
            selectedBankForRate = "HLTC", selectedGradeName = ''
        ) => {
            const rawModelKeyForRate = MODEL_MAPPING[uiModel];
            const modelKeyForRate = rawModelKeyForRate;
            const hasPromoRateForCampaign = hasCampaignInterestRate(rawModelKeyForRate, campaignId);
            // Finance mode มาจาก Policy กลาง ไม่อ่านชื่อ Campaign เพื่อตัดสินสูตร
            const isActuallyDSP_original = !hasPromoRateForCampaign && forcedFinanceType === 'dsp';
            
            if (forcedFinanceType === 'cash') return null;

            // SP095/26: ตรวจเงินดาวน์และระยะผ่อน เฉพาะ Civic ทางเลือก 1
            // Manual Rate ถือเป็นการ Override โดยตั้งใจ จึงไม่บล็อกด้วย Validation นี้
            const hasManualRateOverride = manualRate !== null && manualRate !== undefined && manualRate !== '' && !isNaN(manualRate);
            if (!hasManualRateOverride) {
                const civicPromoIssue = validateCivicPromoCondition(modelKeyForRate, campaignId, downPct, term);
                if (civicPromoIssue) return makeInvalidInstallment(term, civicPromoIssue);
            }

            const netPrice = totalPrice + priceAdjustment;
            const downAmount = Math.round((netPrice * downPct) / 100);
            const financeAmount = netPrice - downAmount;


            if (isActuallyDSP_original) {
                let dspRate = 0;
                let rvPct = 0;

                const mKeyForOption = MODEL_MAPPING[uiModel];
                if (!isDspModelEligible(mKeyForOption)) {
                    return makeInvalidInstallment(term, getDspIneligibleMessage(mKeyForOption, downPct));
                }

                const allowedTerms = getDspAllowedTerms(mKeyForOption, downPct);
                if (!allowedTerms.includes(term)) {
                    return makeInvalidInstallment(term, getDspIneligibleMessage(mKeyForOption, downPct));
                }

                rvPct = getDspBalloonRateByModel(mKeyForOption, term);
                dspRate = getDspRateByModel(mKeyForOption, customerType, term);
                if (!rvPct || dspRate === null || dspRate === undefined) {
                    return makeInvalidInstallment(term, getDspIneligibleMessage(mKeyForOption, downPct));
                }

                // DSP Calculator v26.06.2026:
                // เงินดาวน์และ RV ใช้ราคาหลังหักส่วนลด (netPrice)
                // RV ใช้ค่าจริงในสูตร และปัดเฉพาะตอนแสดงผลตามรูปแบบสกุลเงิน
                const balloon = netPrice * rvPct;
                const totalInterest = financeAmount * (dspRate / 100) * (term / 12);
                const totalDebt = financeAmount + totalInterest;
                const monthlyVal = (totalDebt - balloon) / term;
                const monthly = Math.max(0, Math.floor(monthlyVal)); // Excel: ROUNDDOWN(...,0)

                const enteredExtRate = parseFloat(extensionInterest);
                const extRate = Number.isFinite(enteredExtRate)
                    ? enteredExtRate
                    : getDspExtensionRateByModel(mKeyForOption);
                const calcExt = (months) => {
                    if (!balloon || !Number.isFinite(extRate)) return 0;
                    const interest = balloon * (extRate / 100) * (months / 12);
                    return Math.floor((balloon + interest) / months); // Excel: ROUNDDOWN(...,0)
                };

                return { 
                    term, rate: dspRate.toFixed(2), monthly: isNaN(monthly) ? 0 : monthly, 
                    monthlyNet: isNaN(monthly) ? 0 : monthly,
                    balloon: isNaN(balloon) ? 0 : balloon, ext12: calcExt(12), ext24: calcExt(24), 
                    ext36: term !== 84 ? calcExt(36) : 0, totalInterest: Math.round(totalInterest),
                    subsidyAmount: 0, subsidyMonths: 0
                };
            }

            const isBeg = paymentType === 'beginning';
            const bankForRate = (forcedFinanceType === 'standard' && !hasPromoRateForCampaign) ? selectedBankForRate : null;
            const rate = getInterestRate(modelKeyForRate, campaignId, downPct, term, customerType, isBeg, manualRate, isSpecialOcc, isHondaLoyalty, isHondaCareSupport, bankForRate, selectedGradeName);
            if (rate === null || rate === undefined || isNaN(rate)) {
                return makeInvalidInstallment(term, 'ไม่เข้าเงื่อนไข');
            }

            let monthly = 0;
            let totalInterestVal = 0;
            if (term > 0) {
                 if (rate > 0) {
                      totalInterestVal = financeAmount * (rate / 100) * (term / 12);
                      monthly = (financeAmount + totalInterestVal) / term;
                 } else {
                      monthly = financeAmount / term;
                 }
            }

            const monthlyFinal = Math.max(0, Math.floor(monthly));

            return { 
                term, rate: rate !== null && !isNaN(rate) ? rate.toFixed(2) : "0.00", 
                monthly: isNaN(monthlyFinal) ? 0 : monthlyFinal, 
                monthlyNet: isNaN(monthlyFinal) ? 0 : monthlyFinal,
                balloon: 0, ext12: 0, ext24: 0, ext36: 0, totalInterest: Math.round(totalInterestVal),
                subsidyAmount: 0, subsidyMonths: 0
            };
        };


        const resolveManualRateForTerm = (manualRates, term) => {
            if (manualRates && manualRates[term] !== undefined && manualRates[term] !== '') {
                const parsed = parseFloat(manualRates[term]);
                return Number.isFinite(parsed) ? parsed : null;
            }
            if (term <= 48 && manualRates && manualRates[48] !== undefined && manualRates[48] !== '') {
                const parsed = parseFloat(manualRates[48]);
                return Number.isFinite(parsed) ? parsed : null;
            }
            return null;
        };

        const calculateInstallmentForTerm = (inputs, term, manualRates) => calculateInstallmentDetail(
            inputs.uiModel,
            inputs.totalPrice,
            inputs.priceAdjustment,
            inputs.downPct,
            term,
            inputs.campaignId,
            inputs.campaignName,
            inputs.campaignType,
            inputs.customerType,
            inputs.paymentType,
            inputs.isSpecialOcc,

            inputs.extensionInterest,
            inputs.financeType,
            inputs.selectedBank,
            inputs.gradeName
        );

        const calculateInstallmentMap = (terms, inputs, manualRates) => {
            const results = {};
            (terms || []).forEach(term => {
                results[term] = calculateInstallmentForTerm(inputs, term, manualRates);
            });
            return results;
        };


        // =====================================================================
        // ZONE 4: MAIN APPLICATION STATE & ORCHESTRATION
        // Search keyword: ARCH-ZONE-04
        // =====================================================================
        const App = () => {
            const [uiModel, setUiModel] = useState(UI_MODELS[0]); 
            const [grade, setGrade] = useState(GRADES_DATA[MODEL_MAPPING[UI_MODELS[0]]][0]);

                 const carDiscount = priceAdjustment < 0 ? Math.abs(priceAdjustment) : 0;
                 const cashDiscount = getExpenseValue(expenses.cashDiscount);
                 return carDiscount + cashDiscount;
            }, [priceAdjustment, expenses.cashDiscount]);

            // 3. คำนวณเบี้ยประกันภัย แยกตามคนจ่าย (Honda / AT / Customer)
            const insuranceCosts = useMemo(() => {
                const modelKey = MODEL_MAPPING[uiModel];
                const premiums = INSURANCE_PREMIUMS[modelKey]?.[insuranceDuration] || [];
                
                let dealerPaid = 0;
                let customerPaid = 0;
                let freeYears = 0;

                premiums.forEach((cost, index) => {
                    const year = index + 1;
                    const payer = insurancePayers[year] || 'customer';
                    if (payer === 'dealer') dealerPaid += cost;
                    if (payer === 'customer') customerPaid += cost;
                    if (payer === 'honda' || payer === 'dealer') freeYears++;
                });

                return {
                    dealer: dealerPaid,
                    customer: customerPaid,
                    freeYears: freeYears
                };
            }, [uiModel, insuranceDuration, insurancePayers]);

            // 4. ค่าจดทะเบียน แยกตามคนจ่าย: ลูกค้าชำระ / เอทีแถม
            // ถ้าเลือก "เอทีแถม" ระบบจะไม่บวกในยอดจ่ายวันรับรถ และนำไปหักใน FOC รวมอัตโนมัติ
            const registrationCosts = useMemo(() => {
                const autoMatch = getAtRegistrationFee(MODEL_MAPPING[uiModel], registrationType);
                const autoAmount = autoMatch?.price || 0;
                const typedAmount = getExpenseValue(expenses.registration);
                const amount = typedAmount > 0 ? typedAmount : autoAmount;
                return {
                    customer: registrationPayer === 'customer' ? amount : 0,
                    dealer: registrationPayer === 'dealer' ? amount : 0,
                    amount,
                    autoAmount
                };
            }, [expenses.registration, registrationPayer, sheetBackend, uiModel, grade, registrationType]);

            const effectiveDealerInsuranceCost = useMemo(() => {
                if (insuranceCosts.dealer <= 0) return 0;
                return manualDealerInsuranceCost !== "" ? getExpenseValue(manualDealerInsuranceCost) : insuranceCosts.dealer;
            }, [manualDealerInsuranceCost, insuranceCosts.dealer]);

            const effectiveDealerRegistrationCost = useMemo(() => {
                if (registrationPayer !== 'dealer') return 0;
                return manualDealerRegistrationCost !== "" ? getExpenseValue(manualDealerRegistrationCost) : registrationCosts.dealer;
            }, [manualDealerRegistrationCost, registrationCosts.dealer, registrationPayer]);

            const totalMarginSum = useMemo(() => marginCar3Pct + atStepAmount + marginCampaign + privAmount + extraSubDownMargin + (parseFloat(atHondaMargin) || 0), [marginCar3Pct, atStepAmount, marginCampaign, privAmount, extraSubDownMargin, atHondaMargin]);
            
            // กำไรคงเหลือ: Margin รวม - ส่วนลดให้ลูกค้า - FOC รวม
            // หมายเหตุ: FOC รวม = ของแถมที่ระบุ + เบี้ยประกันเฉพาะกรณี "เอที แถม" + ค่าจดทะเบียนเฉพาะกรณี "เอทีแถม"
            const remainingMarginProfit = useMemo(() => totalMarginSum - customerTotalDiscount - (parseFloat(focExpense) || 0), [totalMarginSum, customerTotalDiscount, focExpense]);

            // Auto-update ค่าใช้จ่ายประกันของลูกค้าในช่อง "ค่าใช้จ่ายวันรับรถ"
            useEffect(() => {
                if (insuranceCosts.customer > 0) {
                     setExpenses(prev => ({ ...prev, insurance: insuranceCosts.customer.toString() }));
                } else {
                     setExpenses(prev => ({ ...prev, insurance: `แถม ${insuranceCosts.freeYears} ปี` }));
                }
            }, [insuranceCosts]);

            // Auto-select ประกันภัยอิงตามทางเลือกแคมเปญ
            // ถ้าแคมเปญระบุฟรีประกัน ระบบตั้งต้นเป็น "ฮอนด้าแถม" จึงไม่หัก FOC
            // ถ้าต้องการให้ "เอที แถม" ให้เปลี่ยนผู้จ่ายในช่องจัดการประกัน ระบบจะดึงเบี้ยตามรุ่นไปใส่ FOC ให้เอง
            useEffect(() => {
                if (campaignFreeInsuranceYears > 0) {
                    setInsuranceDuration(campaignFreeInsuranceYears);
                    setInsurancePayers(getDefaultInsurancePayers(campaignFreeInsuranceYears, 'honda'));
                } else {
                    setInsuranceDuration(1);
                    setInsurancePayers(getDefaultInsurancePayers(0));
                }
            }, [campaign?.id, uiModel, campaignFreeInsuranceYears]);
            // ---------------------------------------------------

            const handleDownAmountChange = (e) => {
                const val = e.target.value;
                setManualDownAmount(val);
                if (val === '') {
                    setDownPct(0);
                    return;
                }
                const numVal = parseFloat(val);
                if (!isNaN(numVal)) {
                    if (numVal > netPrice) setDownPct(100);
                    else setDownPct((numVal / netPrice) * 100);
                }
            };

            const isDSP = canUseDspForSelectedModel && financeType === 'dsp';

            // Debounce only typed manual rates. Model/grade/campaign switches remain immediate.
            const debouncedManualInterestRates = useDebouncedValue(manualInterestRates, 300);
            const installmentCalculationInputs = useMemo(() => ({
                uiModel,
                totalPrice,
                priceAdjustment,
                downPct,
                campaignId: campaign?.id,
                campaignName: campaign?.name,
                campaignType: campaign?.type,
                customerType,
                paymentType,
                isSpecialOcc,
                isHondaLoyalty,
                isHondaCareSupport,
                extensionInterest,
                financeType,
                selectedBank,
                gradeName: grade?.name || ''
            }), [
                uiModel, totalPrice, priceAdjustment, downPct,
                campaign?.id, campaign?.name, campaign?.type,
                customerType, paymentType, isSpecialOcc, isHondaLoyalty, isHondaCareSupport,
                extensionInterest, financeType,
                selectedBank, grade?.name
            ]);

            const calcInstallment = useCallback((term) => (
                calculateInstallmentForTerm(installmentCalculationInputs, term, debouncedManualInterestRates)
            ), [installmentCalculationInputs, debouncedManualInterestRates]);

            const calculatedInstallments = useMemo(() => (
                calculateInstallmentMap(terms, installmentCalculationInputs, debouncedManualInterestRates)
            ), [terms, installmentCalculationInputs, debouncedManualInterestRates]);

            const salesSummaryPurchaseType = bookingData?.purchaseType || (financeType === 'cash' ? 'cash' : 'installment');
            const salesSummaryIsCash = bookingData ? (bookingData.isCash || salesSummaryPurchaseType === 'cash') : financeType === 'cash';
            const salesSummaryTerm = parseInt(bookingData?.selectedTerm || terms[0] || 48);
            const salesSummaryInstallment = !salesSummaryIsCash ? (calculatedInstallments?.[salesSummaryTerm] || calcInstallment(salesSummaryTerm)) : null;
            const salesSummaryFinanceCompany = salesSummaryIsCash ? '-' : (bookingData?.financeCompany || '-');
            const salesSummaryPurchaseText = salesSummaryIsCash ? 'ซื้อสด' : (isDSP || financeType === 'dsp' ? 'ผ่อน Double Smile Plus' : 'ผ่อนปกติ');
            const salesSummaryRateText = salesSummaryInstallment?.rate && salesSummaryInstallment.rate !== '-' ? `${salesSummaryInstallment.rate}%` : '-';
            const salesSummaryMonthlyText = salesSummaryInstallment?.monthly ? `${formatCurrency(salesSummaryInstallment.monthly)} บาท/เดือน` : '-';

            const totalAdditions = getExpenseValue(expenses.insurance) + registrationCosts.customer + getExpenseValue(expenses.redPlate) + getExpenseValue(expenses.accessories) + getExpenseValue(expenses.vatDiscount) + getExpenseValue(expenses.othersAdd) + (paymentType === 'beginning' && financeType !== 'cash' ? getExpenseValue(expenses.firstInstallment) || 0 : 0);
            const totalDeductions = getExpenseValue(expenses.cashDiscount) + getExpenseValue(expenses.deposit) + getExpenseValue(expenses.othersDeduct);
            const totalOnDelivery = (financeType === 'cash' ? netPrice : downAmount) + totalAdditions - totalDeductions;
            const salesSummaryTotalAdditions = getExpenseValue(expenses.insurance) + registrationCosts.customer + getExpenseValue(expenses.redPlate) + getExpenseValue(expenses.accessories) + getExpenseValue(expenses.vatDiscount) + getExpenseValue(expenses.othersAdd) + (!salesSummaryIsCash && paymentType === 'beginning' && !isDSP ? getExpenseValue(expenses.firstInstallment) || 0 : 0);
            const salesSummaryTotalOnDelivery = (salesSummaryIsCash ? netPrice : downAmount) + salesSummaryTotalAdditions - totalDeductions;

            const normalizeStickerInstallment = (result, term, fallbackReason = 'ไม่เข้าเงื่อนไข') => {
                if (!result) {
                    return makeInvalidInstallment(term, fallbackReason);
                }
                if (result.invalid) {
                    return {
                        ...result,
                        term,
                        invalid: true,
                        invalidReason: result.invalidReason || fallbackReason
                    };
                }
                if ((!result.monthly || result.monthly <= 0) && String(result.rate || '') === '-') {
                    return makeInvalidInstallment(term, result.invalidReason || fallbackReason);
                }
                return {
                    ...result,
                    term,
                    monthlyNet: Number(result.monthly || 0),
                    subsidyAmount: 0,
                    subsidyMonths: 0,
                    invalid: false,
                    invalidReason: ''
                };
            };

            const buildStickerSourceCards = (sourceMode = 'quotation', comparisonDownPct = 25) => {
                const allTerms = COMPARE_TERM_OPTIONS;
                const makeInstallments = (calculator, fallbackReason) => {
                    const result = {};
                    allTerms.forEach(term => {
                        result[term] = normalizeStickerInstallment(calculator(term), term, fallbackReason);
                    });
                    return result;
                };

                if (sourceMode === 'quotation') {
                    return [{
                        id: 'quotation-current',
                        model: MODEL_MAPPING[uiModel] || uiModel,
                        grade: grade?.name || '-',
                        color: color?.name || '',
                        retailPrice: totalPrice,
                        netPrice,
                        discountAmount: Math.max(0, -Number(priceAdjustment || 0)) + getExpenseValue(expenses.cashDiscount),
                        downPct,
                        downAmount,
                        deliveryAmount: totalOnDelivery,
                        financeAmount,
                        bankLabel: financeType === 'standard' ? (BANK_LABELS[selectedBank] || selectedBank) : (financeType === 'dsp' ? 'Double Smile Plus' : 'อัตราแคมเปญ'),
                        campaignName: campaign?.name || '',
                        installments: makeInstallments(
                            (term) => calcInstallment(term),
                            financeType === 'cash' ? 'ซื้อสด / ไม่มีค่างวด' : 'ไม่เข้าเงื่อนไข'
                        )
                    }];
                }

                if (sourceMode === 'comparison') {
                    const pct = Number(comparisonDownPct);
                    const safePct = isNaN(pct) ? (Number(selectedDownPcts?.[0]) || 25) : pct;

                    return compareList.map((rawItem, index) => {
                        const item = createCompareItem(rawItem);
                        const mKey = MODEL_MAPPING[item.model];
                        const gradeData = GRADES_DATA[mKey]?.find(g => g.name === item.grade);
                        const colorExtra = item.color ? getColorPrice(item.color, item.grade) : 0;
                        const itemTotalPrice = (gradeData?.price || 0) + colorExtra;
                        const itemNetPrice = itemTotalPrice + (item.priceAdjustment || 0);
                        const grossDown = Math.round((itemNetPrice * safePct) / 100);
                        const netDown = Math.max(0, grossDown - (item.downDiscount || 0));
                        const itemCampaign = OPTION_DATA[mKey]?.find(c => c.id === item.campaignId);
                        const hasPromoRate = hasCampaignInterestRate(mKey, item.campaignId);
                        const activeFinanceType = hasPromoRate ? 'campaign' : (item.financeType || 'standard');
                        const itemCustomerType = toLegacyCustomerType(item.customerType);
                        const itemPaymentType = item.paymentType || 'ending';
                        const itemSpecialOcc = !!item.isSpecialOcc;
                        const itemHondaLoyalty = !!item.isHondaLoyalty;
                        const itemHondaCareSupport = !!item.isHondaCareSupport;
                        const itemSelectedBank = item.selectedBank || 'HLTC';

                        return {
                            id: `comparison-${item.id}-${safePct}-${index}`,
                            model: mKey || item.model,
                            grade: item.grade || '-',
                            color: item.color?.name || '',
                            retailPrice: itemTotalPrice,
                            netPrice: itemNetPrice,
                            discountAmount: Math.max(0, itemTotalPrice - itemNetPrice) + Number(item.downDiscount || 0),
                            downPct: safePct,
                            downAmount: netDown,
                            financeAmount: Math.max(0, itemNetPrice - grossDown),
                            bankLabel: activeFinanceType === 'standard' ? (BANK_LABELS[itemSelectedBank] || itemSelectedBank) : (activeFinanceType === 'dsp' ? 'Double Smile Plus' : 'อัตราแคมเปญ'),
                            campaignName: itemCampaign?.name || '',
                            // ตารางเปรียบเทียบไม่มีค่าใช้จ่ายวันรับรถแยกรายดีล
                            // จึงตั้งต้นจากยอดดาวน์สุทธิและเปิดให้แก้ไขใน Modal ก่อนสร้างภาพ
                            deliveryAmount: netDown,
                            installments: makeInstallments(
                                (term) => calculateInstallmentDetail(
                                    item.model,
                                    itemNetPrice,
                                    0,
                                    safePct,
                                    term,
                                    item.campaignId,
                                    itemCampaign?.name,
                                    itemCampaign?.type,
                                    itemCustomerType,
                                    itemPaymentType,
                                    itemSpecialOcc,
                                    itemHondaLoyalty,
                                    itemHondaCareSupport,
                                    null,
                                    getDspExtensionRateByModel(mKey).toFixed(2),
                                    activeFinanceType,
                                    activeFinanceType === 'standard' ? itemSelectedBank : null,
                                    item.grade
                                ),
                                activeFinanceType === 'cash' ? 'ซื้อสด / ไม่มีค่างวด' : 'ไม่เข้าเงื่อนไข'
                            )
                        };
                    });
                }

                if (sourceMode === 'saved') {
                    return savedQuotes.map((quote, index) => {
                        const quoteModelKey = MODEL_MAPPING[quote.uiModel] || quote.uiModel;
                        const quoteGradeName = quote.grade?.name || quote.grade || '-';
                        const quoteCampaign = (OPTION_DATA[quoteModelKey] || []).find(item => (
                            (quote.campaignId && item.id === quote.campaignId) ||
                            item.name === quote.campaignName
                        ));
                        const quoteTotalPrice = Number(quote.totalPrice ?? ((quote.carPrice || 0) + (quote.colorPriceVal || 0)));
                        const quotePriceAdjustment = Number(quote.priceAdjustment || 0);
                        const quoteDownPct = Number(quote.downPct || 0);
                        const quoteFinanceType = quote.financeType || (quote.isDSP ? 'dsp' : 'standard');
                        const quoteCustomerType = quote.customerType || 'general';
                        const quotePaymentType = quote.paymentType || 'ending';
                        const quoteSpecialOcc = !!quote.isSpecialOcc;
                        const quoteHondaLoyalty = !!quote.isHondaLoyalty;
                        const quoteHondaCareSupport = !!quote.isHondaCareSupport;
                        const quoteBank = quote.selectedBank === 'SCB' ? 'SCB_STANDARD' : (quote.selectedBank || 'HLTC');

                        const installments = {};
                        allTerms.forEach(term => {
                            let stored = quote.installments?.[term];
                            if (stored && (stored.invalid || stored.monthly > 0 || stored.rate === '0.00' || stored.rate === 0)) {
                                installments[term] = normalizeStickerInstallment(stored, term, 'ไม่เข้าเงื่อนไข');
                                return;
                            }

                            if (quoteFinanceType === 'cash') {
                                installments[term] = makeInvalidInstallment(term, 'ซื้อสด / ไม่มีค่างวด');
                                return;
                            }

                            if (quoteCampaign) {
                                const manualRate = quote.manualInterestRates?.[term] !== '' && quote.manualInterestRates?.[term] !== undefined
                                    ? parseFloat(quote.manualInterestRates[term])
                                    : null;
                                const recalculated = calculateInstallmentDetail(
                                    quote.uiModel,
                                    quoteTotalPrice,
                                    quotePriceAdjustment,
                                    quoteDownPct,
                                    term,
                                    quoteCampaign.id,
                                    quoteCampaign.name,
                                    quoteCampaign.type,
                                    quoteCustomerType,
                                    quotePaymentType,
                                    quoteSpecialOcc,
                                    quoteHondaLoyalty,
                                    quoteHondaCareSupport,
                                    manualRate,
                                    getDspExtensionRateByModel(quoteModelKey).toFixed(2),
                                    quoteFinanceType,
                                    quoteFinanceType === 'standard' ? quoteBank : null,
                                    quoteGradeName
                                );
                                installments[term] = normalizeStickerInstallment(recalculated, term, 'ไม่เข้าเงื่อนไข');
                            } else {
                                installments[term] = makeInvalidInstallment(term, 'ไม่มีข้อมูลค่างวดในใบเสนอราคาที่บันทึก');
                            }
                        });

                        return {
                            id: `saved-${quote.id || index}`,
                            model: quoteModelKey || quote.uiModel || '-',
                            grade: quoteGradeName,
                            color: quote.color?.name || '',
                            retailPrice: quoteTotalPrice,
                            netPrice: Number(quote.netPrice ?? (quoteTotalPrice + quotePriceAdjustment)),
                            discountAmount: Math.max(0, -quotePriceAdjustment) + Number(quote.cashDiscount || 0),
                            downPct: quoteDownPct,
                            downAmount: Number(quote.downAmount || 0),
                            deliveryAmount: Number(quote.totalOnDelivery ?? quote.downAmount ?? 0),
                            financeAmount: Number(quote.financeAmount || 0),
                            bankLabel: quoteFinanceType === 'standard' ? (BANK_LABELS[quoteBank] || quoteBank) : (quoteFinanceType === 'dsp' ? 'Double Smile Plus' : 'อัตราแคมเปญ'),
                            campaignName: quoteCampaign?.name || quote.campaignName || '',
                            installments
                        };
                    });
                }

                return [];
            };

            // =================================================================
            // [OS-06] OFFER STUDIO INTEGRATION HANDLERS
            // Opens the studio, maps current calculator data and exports PNG.
            // =================================================================
            const handleOpenSticker = (name) => {
                setPendingFileName(name || `${uiModel} ${grade?.name || ''}`.trim());
                setShowActionModal(false);
                setShowStickerModal(true);
            };

            // =================================================================
            // OS-REV-09 — OFFER STUDIO EXPORT: CAPTURE THE ACTUAL LIVE PREVIEW
            // จุดสำคัญ: รูปก่อนดาวน์โหลดและรูปที่ดาวน์โหลดต้องมาจาก Preview DOM
            // ตัวเดียวกับที่ผู้ใช้เห็น ไม่สร้าง Renderer ใหม่ ไม่ Clone และไม่ Reflow
            // จึงรักษาตำแหน่ง เว้นวรรค line-height และกรอบให้ตรงกับ Preview
            // Search keyword: OS-REV-09-PREVIEW-CAPTURE
            // =================================================================
            const waitForOfferExportAssets = async (root) => {
                if (document.fonts) {
                    try {
                        // โหลดเฉพาะน้ำหนักที่ Offer Studio ใช้จริง เพื่อลดการสลับ Font
                        const usedWeights = [...new Set(Object.values(OFFER_FONT_WEIGHTS))];
                        const fontJobs = [];
                        usedWeights.forEach(weight => {
                            fontJobs.push(document.fonts.load(`${weight} 16px Prompt`));
                            fontJobs.push(document.fonts.load(`italic ${weight} 16px Prompt`));
                        });
                        await Promise.all(fontJobs);
                        await document.fonts.ready;
                    } catch (e) {}
                }

                const images = Array.from(root.querySelectorAll('img'));
                await Promise.all(images.map(img => {
                    if (img.complete && img.naturalWidth > 0) {
                        return img.decode ? img.decode().catch(() => undefined) : Promise.resolve();
                    }
                    return new Promise(resolve => {
                        const done = () => resolve();
                        img.addEventListener('load', done, { once:true });
                        img.addEventListener('error', done, { once:true });
                        setTimeout(done, 5000);
                    });
                }));
                await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
            };

            // =================================================================
            // =================================================================
            // =================================================================
            // OS-REV-15 — SINGLE CANONICAL RENDERER + DIRECT 1:1 CAPTURE
            // Source of truth = DOM node เดียวกับ Preview ที่ผู้ใช้เห็น
            // - Renderer มีเพียงหนึ่งชุด ไม่เกิด Mobile/Desktop/Fullscreen ซ้ำกัน
            // - Capture จาก root จริง ไม่จับ outer frame ที่ถูก scale
            // - ไม่ Clone DOM, ไม่แก้ font, padding, line-height หรือช่องว่างภายใน
            // - การอัปโหลดภาพจากเครื่องยังใช้ FileReader/Data URL แบบเดิม
            // Search keyword: OS-REV-15-SINGLE-CANONICAL-EXPORT
            // =================================================================
            const waitForCanonicalOfferRenderer = async (root) => {
                if (!root || !root.isConnected) throw new Error('Renderer ของพรีวิวยังไม่พร้อม');
                await waitForOfferExportAssets(root);

                if (document.fonts) {
                    const checks = [...new Set(Object.values(OFFER_FONT_WEIGHTS))].map(weight =>
                        document.fonts.check(`${weight} 16px Prompt`) &&
                        document.fonts.check(`italic ${weight} 16px Prompt`)
                    );
                    if (checks.some(result => !result)) {
                        await document.fonts.ready;
                        await new Promise(resolve => setTimeout(resolve, 80));
                    }
                }
                await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
            };

            const auditCanonicalOfferLayout = (root) => {
                const issues = [];
                const rootRect = root.getBoundingClientRect();
                const tolerance = 1.5;

                root.querySelectorAll('[data-offer-section]').forEach(section => {
                    const rect = section.getBoundingClientRect();
                    const name = section.dataset.offerSection || 'unknown';
                    if (rect.top < rootRect.top - tolerance || rect.left < rootRect.left - tolerance || rect.right > rootRect.right + tolerance || rect.bottom > rootRect.bottom + tolerance) {
                        issues.push(`${name} เกินกรอบภาพ`);
                    }
                    if (section.scrollWidth > section.clientWidth + 2) issues.push(`${name} ล้นด้านข้าง`);
                    if (section.scrollHeight > section.clientHeight + 2 && getComputedStyle(section).overflow !== 'visible') issues.push(`${name} ถูกตัดด้านล่าง`);
                });

                const sections = Array.from(root.querySelectorAll('[data-offer-section]'))
                    .map(node => ({ name: node.dataset.offerSection || 'unknown', rect: node.getBoundingClientRect() }))
                    .sort((a, b) => a.rect.top - b.rect.top);
                for (let i = 1; i < sections.length; i++) {
                    const prev = sections[i - 1];
                    const current = sections[i];
                    if (current.rect.top < prev.rect.bottom - 1) {
                        issues.push(`${current.name} ซ้อนกับ ${prev.name}`);
                    }
                }
                return [...new Set(issues)];
            };

            const captureOfferStudioCanvas = async (config) => {
                const root = config?.__renderElement;
                if (!root || !root.isConnected) throw new Error('ไม่พบ Renderer ตัวจริงของพรีวิว');

                const exportWidth = Math.max(1, Math.round(Number(config.canvas?.width) || root.offsetWidth || 1080));
                const exportHeight = Math.max(1, Math.round(Number(config.canvas?.height) || root.offsetHeight || 1350));
                const transparent = config.backgroundMode === 'transparent';
                const wrapper = root.parentElement;
                const frame = wrapper?.parentElement;

                await waitForCanonicalOfferRenderer(root);

                const originalFrameStyle = frame?.getAttribute('style');
                const originalWrapperStyle = wrapper?.getAttribute('style');
                const originalScrollX = window.scrollX;
                const originalScrollY = window.scrollY;

                try {
                    // เปลี่ยนเฉพาะบริบทการแสดงของ parent เพื่อให้ root ขนาดจริงอยู่ใน viewport
                    // ไม่แตะ style ภายใน Renderer จึงไม่เกิด reflow ของข้อความ
                    if (frame) {
                        frame.style.position = 'fixed';
                        frame.style.left = '0px';
                        frame.style.top = '0px';

                    await waitForCanonicalOfferRenderer(root);

                    const rootRect = root.getBoundingClientRect();

                        throw new Error(`ขนาด Renderer ไม่ตรงกับภาพที่ตั้งไว้ (${Math.round(rootRect.width)}×${Math.round(rootRect.height)} แทน ${exportWidth}×${exportHeight})`);

                    ctx.drawImage(captured, 0, 0, captured.width, captured.height, 0, 0, exportWidth, exportHeight);
                    return exactCanvas;
                } finally {

                                                                        <input type="number" placeholder="ส่วนลดราคารถ" value={item.priceAdjustment === 0 ? '' : item.priceAdjustment} onChange={(e) => updateItem({priceAdjustment:parseFloat(e.target.value) || 0})} className="md:col-span-2 text-xs border-gray-200 rounded p-1.5 bg-gray-50 text-right font-medium" />

                                                                        <select value={item.color ? item.color.name : ""} onChange={(e) => { const cName = e.target.value; updateItem({color: cName ? availColors.find(c=>c.name===cName) : null}); }} className="md:col-span-3 text-xs border-gray-200 rounded p-1.5 bg-gray-50 font-bold text-gray-700">
                                                                            <option value="">ยังไม่ระบุสี</option>

                                                                    </div>
                                                                    <div className="grid grid-cols-1 md:grid-cols-12 gap-2 items-center">

                                                                        {itemHasPromoRate ? (
                                                                            <div className="md:col-span-4 text-[11px] bg-emerald-50 border border-emerald-100 text-emerald-700 rounded-lg px-2 py-1.5 font-bold">ใช้ดอกเบี้ยแคมเปญ CP001</div>
                                                                        ) : (
                                                                            <>
                                                                                <select value={item.financeType || 'standard'} onChange={(e) => { const nextType=e.target.value; updateItem(nextType === 'standard' ? {financeType:nextType, isHondaLoyalty:false, isHondaCareSupport:false} : {financeType:nextType}); }} className="md:col-span-2 text-xs border-blue-200 rounded p-1.5 bg-blue-50 text-blue-800 font-bold">
                                                                                    <option value="cash">ซื้อสด</option>
                                                                                    <option value="standard">Standard Rate</option>
                                                                                    <option value="dsp" disabled={!isDspModelEligible(mKey)}>DSP</option>
                                                                                </select>
                                                                                {item.financeType === 'standard' ? (
                                                                                    <select value={item.selectedBank || 'HLTC'} onChange={(e) => updateItem({selectedBank:e.target.value})} className="md:col-span-2 text-xs border-blue-200 rounded p-1.5 bg-blue-50 text-blue-800 font-bold">
                                                                                        {itemBankOptions.map(bank => <option key={bank.value} value={bank.value}>{bank.label}</option>)}
                                                                                    </select>
                                                                                ) : <div className="md:col-span-2 text-[11px] text-gray-400 px-2">{item.financeType === 'dsp' ? 'Double Smile Plus' : 'ซื้อสด'}</div>}
                                                                            </>
                                                                        )}
                                                                        <div className="md:col-span-3 text-[11px] text-gray-500 truncate">{currentCampaignForItem?.name || '-'}</div>
                                                                    </div>
                                                                    <div className="grid grid-cols-1 md:grid-cols-12 gap-2 items-start">
                                                                        <div className="md:col-span-5 flex flex-wrap gap-1">
                                                                            {itemAvailableTerms.map(t => (

                                                                        </select>
                                                                        <select value={item.isSpecialOcc ? 'yes' : 'no'} disabled={!itemDiscountEligibility.specialOcc} onChange={(e) => updateItem({isSpecialOcc:e.target.value === 'yes'})} className={`md:col-span-2 text-xs border-gray-200 rounded p-1.5 bg-gray-50 text-gray-700 font-bold ${!itemDiscountEligibility.specialOcc ? 'opacity-50 cursor-not-allowed' : ''}`}>

                                                                </div>
                                                            )

                                                        const netPrice = gPrice + (item.priceAdjustment || 0);

                                                        const itemHasPromoRate = hasCampaignInterestRate(mKey, item.campaignId);

                                                        const isItemDSP = activeFinanceType === 'dsp';

                                                        const itemSelectedBank = item.selectedBank || 'HLTC';

                                                        return (

                                                                <div className="bg-gray-800 text-white px-4 py-2 flex justify-between items-center">

                                                                    <div className="text-right"><span className="text-lg font-bold">{formatCurrency(gPrice)}</span>{item.priceAdjustment !== 0 && <span className={`text-xs mt-1 block ${item.priceAdjustment > 0 ? 'text-green-400' : 'text-red-400'}`}>{item.priceAdjustment > 0 ? `+${formatCurrency(item.priceAdjustment)}` : formatCurrency(item.priceAdjustment)}</span>}</div>

                                                                {activeFinanceType === 'standard' && (() => {

                                                                        </div>
                                                                    ) : null;

                                                                {activeFinanceType === 'cash' ? (

                                                                        {selectedDownPcts.map(pct => {
                                                                            const dA = Math.round((netPrice * pct) / 100);

                                                                                <div key={pct} className="border border-gray-200 rounded-xl overflow-hidden shadow-sm">

                                                                                        {item.downDiscount > 0 && (<span className="text-xs text-green-700 font-bold bg-green-100 px-2 py-1 rounded border border-green-200">ดาวน์หลังหักส่วนลด: {formatCurrency(netDown)}</span>)}

                                                                                                    <th className="py-3 px-4 text-right font-medium bg-blue-800 border-l border-blue-700">ขยาย 24 งวด</th>
                                                                                                    <th className="py-3 px-4 text-right font-medium bg-blue-800 border-l border-blue-700">ขยาย 36 งวด</th>
                                                                                                </tr>
                                                                                            </thead>

                                                                                                    return (

                                                                                                                    <span className="text-xs text-red-600 font-bold whitespace-normal leading-snug block max-w-[180px] ml-auto">{res.invalidReason}</span>
                                                                                                                ) : (formatCurrency(res.monthly))}
                                                                                                            </td>
                                                                                                            <td className="py-3 px-4 text-right font-bold text-gray-700 border-l border-gray-100 bg-blue-50/10 text-base">{formatCurrency(res.balloon)}</td>

                                                                                                            <td className="py-3 px-4 text-right text-gray-600 border-l border-gray-100 bg-blue-50/10">{res.balloon > 0 ? formatCurrency(res.ext24) : '-'}</td>
                                                                                                            <td className="py-3 px-4 text-right text-gray-600 border-l border-gray-100 bg-blue-50/10">{res.balloon > 0 && t !== 84 ? formatCurrency(res.ext36) : '-'}</td>
                                                                                                        </tr>
                                                                                                    )
                                                                                                })}
                                                                                            </tbody>
                                                                                        </table>
                                                                                    </div>
                                                                                    <div className="px-4 pb-3 pt-1 text-right text-[10px] text-gray-500 italic">{DSP_EXTENSION_NOTE}</div>
                                                                                </div>
                                                                            )
                                                                        })}
                                                                    </div>
                                                                ) : (
                                                                    <div className="table-responsive shadow-sm bg-white">
                                                                        <table className="w-full text-sm">
                                                                            <thead>
                                                                                <tr className="bg-gray-50 text-gray-500 text-xs uppercase border-b border-gray-200">
                                                                                    <th className="py-2 text-center w-20">อัตรา</th>
                                                                                    <th className="py-2 text-center w-32">เงินดาวน์</th>
                                                                                    {itemTerms.map(t => <th key={t} className="py-2 text-center pr-4">{t} งวด</th>)}
                                                                                </tr>
                                                                            </thead>
                                                                            <tbody className="divide-y divide-gray-100">
                                                                                {selectedDownPcts.map(pct => { 
                                                                                    const dA = Math.round((netPrice*pct)/100); 
                                                                                    const netDown = Math.max(0, dA - (item.downDiscount || 0));
                                                                                    return (
                                                                                        <tr key={pct} className="hover:bg-gray-50 transition border-b border-gray-100 last:border-0">
                                                                                            <td className="py-3 px-2 text-center bg-gray-50/50 align-top border-r border-gray-100"><div className="font-bold text-base text-red-600">{pct}%</div></td>
                                                                                            <td className="py-3 px-3 text-center align-top border-r border-gray-100">
                                                                                                <div className="font-bold text-xl text-gray-900 tracking-tight">{formatCurrency(dA)}</div>
                                                                                                {item.downDiscount > 0 && (
                                                                                                    <div className="mt-1.5 text-center"><span className="block text-[10px] font-light text-green-700 leading-none">ดาวน์หลังส่วนลด</span><span className="block text-base font-bold text-green-700">{formatCurrency(netDown)}</span></div>
                                                                                                )}
                                                                                            </td>
                                                                                            {itemTerms.map(t => { 
                                                                                                const res = calculateInstallmentDetail(item.model, netPrice, 0, pct, t, item.campaignId, currentCampaign?.name, currentCampaign?.type, itemCustomerType, itemPaymentType, itemIsSpecialOcc, itemIsHondaLoyalty, itemIsHondaCareSupport, null, getDspExtensionRateByModel(mKey).toFixed(2), activeFinanceType, activeFinanceType === 'standard' ? itemSelectedBank : null, item.grade);
                                                                                                  return (
                                                                                                      <td key={t} className="py-3 px-2 text-center pr-4 align-top">
                                                                                                          <div className="font-bold text-red-600 text-lg">{res?.invalid ? <span className="text-xs font-bold whitespace-normal leading-snug block max-w-[170px] mx-auto">{res.invalidReason}</span> : (res ? formatCurrency(res.monthly) : '-')}</div>
                                                                                                          <div className="text-[10px] text-gray-400">({res && !res.invalid ? res.rate : '-'}%)</div>
                                                                                                      </td>
                                                                                                  );
                                                                                            })}
                                                                                        </tr>
                                                                                    );
                                                                                })}
                                                                            </tbody>
                                                                        </table>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        )
                                                    })}
                                                </div>
                                            </div>
                                </div>
                                <div className="at-bottom-strip mt-auto" aria-hidden="true"></div>
                            </div>
                        </div>
                        )}

                        {/* ================================================================
                            V3-COMPARE — เปรียบเทียบใบเสนอราคาที่เลือกไว้ (ข้อมูลครบรวมของแถม)
                           ================================================================ */}
                        {viewMode === 'compare_saved' && (

                                         </div>
                                    </div>
                                </div>

                            <div className="border border-gray-200 rounded-xl p-4 mb-4">

                                                <span className="font-medium break-words">{g || "-"}</span>

                            </div>

                                    <p className="text-base text-gray-400 mt-1">{consultantPhone} {consultantLine ? `Line: ${consultantLine}` : ''}</p>
                                </div>
                            </div>
                        </div>

                        <div id="sales-summary-card" className="bg-white p-4 w-[1120px] h-auto relative">

                                    <div className="w-14 h-14 bg-gray-900 text-white flex items-center justify-center rounded-2xl text-2xl"><i className="fa-solid fa-clipboard-list"></i></div>
                                    <div>
                                        <h1 className="text-xl font-bold text-gray-900">ใบสรุปการขาย</h1>
                                        <p className="text-gray-500 text-base">Sales Summary & Internal Margin Report</p>

                                    </div>
                                </div>

                                    <p className="text-gray-500 mt-2">ผู้ขาย</p>
                                    <p className="text-lg font-bold text-gray-900">{consultantName || '-'}</p>
                                    <p className="text-gray-600">{consultantPhone || ''} {consultantLine ? `Line: ${consultantLine}` : ''}</p>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4 mb-4">
                                <div className="border border-gray-200 rounded-2xl overflow-hidden">
                                    <div className="bg-gray-900 text-white px-4 py-2 font-bold">1) รายการซื้อ / ข้อมูลรถ</div>
                                    <div className="p-3 space-y-1.5 text-sm">
                                        <div className="flex justify-between border-b pb-1"><span className="text-gray-500">ชื่อลูกค้า / ชื่อดีล</span><span className="font-bold text-gray-900">{pendingFileName || '-'}</span></div>
                                        <div className="flex justify-between border-b pb-1"><span className="text-gray-500">รุ่น</span><span className="font-bold">{uiModel}</span></div>
                                        <div className="flex justify-between border-b pb-1"><span className="text-gray-500">เกรด</span><span className="font-bold">{grade?.name || '-'}</span></div>
                                        <div className="flex justify-between border-b pb-1"><span className="text-gray-500">สี</span><span className="font-bold text-right">{color?.name || '-'}</span></div>
                                        <div className="flex justify-between border-b pb-1"><span className="text-gray-500">ราคารถ</span><span className="font-bold">{formatCurrency(carPrice)} บาท</span></div>
                                        <div className="flex justify-between border-b pb-1"><span className="text-gray-500">ค่าสี</span><span className="font-bold">{formatCurrency(colorPriceVal)} บาท</span></div>
                                        <div className="flex justify-between border-b pb-1"><span className="text-gray-500">ปรับราคา / ส่วนลดตัวรถ</span><span className={`font-bold ${priceAdjustment < 0 ? 'text-red-600' : 'text-emerald-600'}`}>{priceAdjustment < 0 ? '-' : ''}{formatCurrency(Math.abs(priceAdjustment))} บาท</span></div>

                                        <div className="pt-2 mt-1 border-t text-sm text-gray-600"><span className="font-bold">แคมเปญ:</span> {campaign?.name || '-'}</div>
                                    </div>
                                </div>

                                <div className="border border-gray-200 rounded-2xl overflow-hidden">
                                    <div className="bg-red-600 text-white px-4 py-2 font-bold">2) รายละเอียดการเงิน / ไฟแนนซ์</div>
                                    <div className="p-3 space-y-1.5 text-sm">
                                        <div className="flex justify-between border-b pb-1"><span className="text-gray-500">ประเภทการซื้อ</span><span className="font-bold">{salesSummaryPurchaseText}</span></div>

                                        {!salesSummaryIsCash && <div className="flex justify-between border-b pb-1"><span className="text-gray-500">งวดที่เลือกในใบจอง</span><span className="font-bold text-red-600">{salesSummaryTerm} งวด</span></div>}

                                        <div className="flex justify-between border-b pb-1"><span className="text-gray-500">เงินดาวน์</span><span className="font-bold">{salesSummaryIsCash ? '-' : `${formatCurrency(downAmount)} บาท (${parseFloat(Number(downPct).toFixed(2))}%)`}</span></div>

                                        {bookingData?.bookingDate && <div className="flex justify-between border-b pb-1"><span className="text-gray-500">วันที่จอง</span><span className="font-bold">{formatThaiDate(bookingData.bookingDate)}</span></div>}
                                        {!salesSummaryIsCash && (
                                            <div className="mt-2 border rounded-xl overflow-hidden">
                                                <div className="grid grid-cols-4 bg-gray-100 text-gray-600 font-bold text-xs px-3 py-1.5">
                                                    <span>งวดที่เลือก</span><span className="text-right">ดอกเบี้ย</span><span className="text-right">ค่างวด</span><span className="text-right">Balloon</span>
                                                </div>
                                                <div className="grid grid-cols-4 text-sm px-3 py-2 border-t bg-red-50 text-red-700 font-bold">
                                                    <span>{salesSummaryTerm} งวด</span>
                                                    <span className="text-right">{salesSummaryRateText}</span>
                                                    <span className="text-right">{salesSummaryMonthlyText}</span>
                                                    <span className="text-right">{salesSummaryInstallment?.balloon ? formatCurrency(salesSummaryInstallment.balloon) : '-'}</span>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>

                                        <div className="flex justify-between border-b pb-1"><span>ค่ามัดจำป้ายแดง</span><span className="font-bold">{formatCurrency(expenses.redPlate)}</span></div>
                                        <div className="flex justify-between border-b pb-1"><span>ค่าอุปกรณ์ตกแต่ง</span><span className="font-bold">{formatCurrency(expenses.accessories)}</span></div>
                                        <div className="flex justify-between border-b pb-1"><span>VAT</span><span className="font-bold">{formatCurrency(expenses.vatDiscount)}</span></div>
                                        <div className="flex justify-between border-b pb-1"><span>{expenses.othersAddLabel || 'อื่นๆ (บวก)'}</span><span className="font-bold">{formatCurrency(expenses.othersAdd)}</span></div>

                                        <div className="flex justify-between text-red-600 border-t pt-2"><span>หัก ส่วนลดเงินสด</span><span>-{formatCurrency(expenses.cashDiscount)}</span></div>
                                        <div className="flex justify-between text-green-600"><span>หัก มัดจำ</span><span>-{formatCurrency(expenses.deposit)}</span></div>
                                        <div className="flex justify-between text-green-600"><span>หัก อื่นๆ</span><span>-{formatCurrency(expenses.othersDeduct)}</span></div>
                                        <div className="flex justify-between items-center bg-red-50 border border-red-100 rounded-xl px-3 py-2 mt-2 text-base">
                                            <span className="font-bold text-red-700">รวมจ่ายสุทธิ</span>
                                            <span className="text-xl font-bold text-red-700">{formatCurrency(salesSummaryTotalOnDelivery)} บาท</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="border border-gray-200 rounded-2xl overflow-hidden h-full">

                                    <div className="p-3 space-y-1.5 text-sm">
                                        <div className="flex justify-between border-b pb-1"><span>Margin รถ {Math.round(atMarginPct * 1000) / 10}%</span><span className="font-bold text-emerald-700">{formatCurrency(marginCar3Pct)}</span></div>
                                        <div className="flex justify-between border-b pb-1"><span>AT แคมเปญ (Step)</span><span className="font-bold text-emerald-700">{formatCurrency(atStepAmount)}</span></div>
                                        <div className="flex justify-between border-b pb-1"><span>Margin จากแคมเปญ</span><span className="font-bold text-emerald-700">{formatCurrency(marginCampaign)}</span></div>
                                        <div className="flex justify-between border-b pb-1"><span>ซับดาวน์ / อัพราคา</span><span className="font-bold text-emerald-700">{formatCurrency(extraSubDownMargin)}</span></div>
                                        <div className="flex justify-between border-b pb-1"><span>สิทธิพิเศษ Honda</span><span className="font-bold text-emerald-700">{formatCurrency(privAmount)}</span></div>
                                        <div className="flex justify-between border-b pb-1"><span>Margin เพิ่มเติม</span><span className="font-bold text-emerald-700">{formatCurrency(atHondaMargin)}</span></div>
                                        <div className="flex justify-between border-t pt-2"><span className="font-bold text-gray-800">รวม Margin</span><span className="font-bold text-xl text-emerald-700">{formatCurrency(totalMarginSum)}</span></div>
                                        <div className="flex justify-between text-red-600"><span>หัก ส่วนลดให้ลูกค้า</span><span>-{formatCurrency(customerTotalDiscount)}</span></div>
                                        <div className="flex justify-between text-red-600"><span>หัก FOC รวม</span><span>-{formatCurrency(totalFocExpense)}</span></div>
                                        <div className="flex justify-between items-center bg-emerald-50 border border-emerald-100 rounded-xl px-3 py-2 mt-2 text-base">
                                            <span className="font-bold text-emerald-700">กำไรคงเหลือสุทธิ</span>
                                            <span className={`text-xl font-bold ${remainingMarginProfit >= 0 ? 'text-emerald-700' : 'text-red-600'}`}>{formatCurrency(remainingMarginProfit)}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="border border-gray-200 rounded-2xl overflow-hidden mb-4">
                                <div className="bg-slate-900 text-white px-4 py-2 font-bold">5) FOC ภายใน</div>
                                <div className="p-3">
                                    <div className="grid grid-cols-4 gap-2 text-xs mb-2">
                                        <div className="flex justify-between bg-amber-50 border border-amber-100 rounded-xl px-3 py-2"><span>รวมของแถม</span><span className="font-bold">{formatCurrency(totalGiftValue)} บาท</span></div>
                                        <div className="flex justify-between bg-orange-50 border border-orange-100 rounded-xl px-3 py-2"><span>ประกัน เอทีแถม</span><span className="font-bold">{formatCurrency(effectiveDealerInsuranceCost)} บาท</span></div>
                                        <div className="flex justify-between bg-orange-50 border border-orange-100 rounded-xl px-3 py-2"><span>จดทะเบียน เอทีแถม</span><span className="font-bold">{formatCurrency(effectiveDealerRegistrationCost)} บาท</span></div>
                                        <div className="flex justify-between bg-gray-900 text-white rounded-xl px-3 py-2"><span className="font-bold">รวม FOC</span><span className="font-bold">{formatCurrency(totalFocExpense)} บาท</span></div>
                                    </div>
                                    <div className="border rounded-xl p-2 text-[11px] text-gray-600">
                                        <p className="font-bold text-gray-800 mb-1">รายละเอียดประกัน</p>
                                        <div className="grid grid-cols-3 gap-x-4 gap-y-0.5">
                                            {Array.from({length: insuranceDuration}).map((_, i) => {
                                                const year = i + 1;
                                                const payer = insurancePayers[year] || 'customer';
                                                const premium = (INSURANCE_PREMIUMS[MODEL_MAPPING[uiModel]]?.[insuranceDuration] || [])[i] || 0;
                                                const payerText = payer === 'honda' ? 'ฮอนด้าแถม' : payer === 'dealer' ? 'เอทีแถม' : 'ลูกค้าชำระ';
                                                return <div key={year} className="flex justify-between border-b last:border-0 py-0.5"><span>ปีที่ {year}: {payerText}</span><span>{formatCurrency(premium)} บาท</span></div>;
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="border border-gray-200 rounded-2xl overflow-hidden mb-4">
                                <div className="bg-amber-500 text-white px-4 py-2 font-bold flex items-center justify-between">
                                    <span>6) รายการของแถม</span>
                                    <span className="text-xs bg-white/20 rounded-full px-3 py-1">รวม {totalGiftCount} รายการ</span>
                                </div>
                                <div className="p-3">
                                    {totalGiftCount === 0 ? (
                                        <div className="border rounded-xl px-3 py-2 text-gray-400 italic text-sm">ไม่มีรายการของแถม</div>
                                    ) : (
                                        <div className="grid grid-cols-2 gap-2">
                                            {gifts.map((gift, index) => gift.trim() ? (
                                                <div key={index} className="grid grid-cols-12 items-center text-xs px-3 py-1.5 border rounded-lg bg-white">
                                                    <span className="col-span-1 text-gray-400 font-bold">{index + 1}</span>
                                                    <span className="col-span-8 font-medium leading-snug whitespace-normal pr-2">{gift}</span>
                                                    <span className="col-span-3 text-right font-bold">{formatCurrency(giftValues[index])}</span>
                                                </div>
                                            ) : null)}
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="text-[11px] text-gray-500 border-t pt-2">
                                *เอกสารนี้เป็นสรุปจากข้อมูล ณ หน้าคำนวณปัจจุบัน ใช้ตรวจสอบรายการขาย ค่าใช้จ่ายลูกค้า Margin และ FOC ภายในก่อนส่งมอบ/บันทึกประวัติ
                            </div>
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
